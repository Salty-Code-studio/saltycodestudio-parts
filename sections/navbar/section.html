<!-- saltycodestudio — Navbar (Sand & Surf) -->
<!-- Plain HTML + Tailwind utilities. Requires the small toggle script at the bottom. -->
<header
  id="scs-navbar"
  class="sticky top-0 z-50 border-b border-transparent bg-[#F2EBDD] transition-colors duration-300"
>
  <nav
    aria-label="Primary"
    class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-6 px-5 sm:px-8"
  >
    <!-- Brand -->
    <a
      href="#top"
      class="group flex shrink-0 items-center gap-2.5 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] focus-visible:ring-offset-2 focus-visible:ring-offset-[#F2EBDD]"
    >
      <span
        aria-hidden="true"
        class="grid h-9 w-9 place-items-center rounded-xl bg-[#0E3A40] font-mono text-lg font-bold leading-none text-[#F2EBDD] transition-transform duration-300 group-hover:-rotate-6"
        >~&lt;</span
      >
      <span class="text-lg font-bold tracking-tight text-[#0E3A40]" style="font-family:'Space Grotesk',system-ui,sans-serif">
        saltycodestudio
      </span>
    </a>

    <!-- Desktop links -->
    <ul class="hidden items-center gap-1 md:flex">
      <li>
        <a href="#work" class="relative rounded-lg px-3 py-2 text-sm font-medium text-[#1C2B2E]/80 transition-colors hover:text-[#0E3A40] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] after:absolute after:inset-x-3 after:-bottom-0.5 after:h-0.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-[#FF6F59] after:transition-transform after:duration-300 hover:after:scale-x-100">Work</a>
      </li>
      <li>
        <a href="#services" class="relative rounded-lg px-3 py-2 text-sm font-medium text-[#1C2B2E]/80 transition-colors hover:text-[#0E3A40] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] after:absolute after:inset-x-3 after:-bottom-0.5 after:h-0.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-[#FF6F59] after:transition-transform after:duration-300 hover:after:scale-x-100">Services</a>
      </li>
      <li>
        <a href="#process" class="relative rounded-lg px-3 py-2 text-sm font-medium text-[#1C2B2E]/80 transition-colors hover:text-[#0E3A40] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] after:absolute after:inset-x-3 after:-bottom-0.5 after:h-0.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-[#FF6F59] after:transition-transform after:duration-300 hover:after:scale-x-100">Process</a>
      </li>
      <li>
        <a href="#pricing" class="relative rounded-lg px-3 py-2 text-sm font-medium text-[#1C2B2E]/80 transition-colors hover:text-[#0E3A40] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] after:absolute after:inset-x-3 after:-bottom-0.5 after:h-0.5 after:origin-left after:scale-x-0 after:rounded-full after:bg-[#FF6F59] after:transition-transform after:duration-300 hover:after:scale-x-100">Pricing</a>
      </li>
    </ul>

    <!-- Desktop actions -->
    <div class="hidden items-center gap-2 md:flex">
      <a href="#signin" class="rounded-lg px-3 py-2 text-sm font-medium text-[#1C2B2E]/80 transition-colors hover:text-[#0E3A40] focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59]">Sign in</a>
      <a href="#contact" class="rounded-xl bg-[#FF6F59] px-4 py-2 text-sm font-semibold text-[#1C2B2E] shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md hover:shadow-[#FF6F59]/30 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] focus-visible:ring-offset-2 focus-visible:ring-offset-[#F2EBDD]">Start a project</a>
    </div>

    <!-- Mobile hamburger -->
    <button
      type="button"
      id="scs-nav-toggle"
      aria-expanded="false"
      aria-controls="scs-mobile-menu"
      aria-label="Open menu"
      class="relative grid h-10 w-10 place-items-center rounded-xl text-[#0E3A40] transition-colors hover:bg-[#0E3A40]/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#FF6F59] md:hidden"
    >
      <span class="sr-only">Open menu</span>
      <span aria-hidden="true" class="block h-4 w-5">
        <span data-bar="top" class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 -translate-y-1.5 rounded-full bg-current transition-transform duration-300"></span>
        <span data-bar="mid" class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-current transition-opacity duration-200"></span>
        <span data-bar="bot" class="absolute left-1/2 top-1/2 h-0.5 w-5 -translate-x-1/2 translate-y-1.5 rounded-full bg-current transition-transform duration-300"></span>
      </span>
    </button>
  </nav>

  <!-- Mobile sheet -->
  <div id="scs-mobile-menu" class="hidden md:hidden">
    <button type="button" data-nav-backdrop aria-label="Close menu" class="fixed inset-0 top-16 z-40 cursor-default bg-[#1C2B2E]/20 backdrop-blur-sm"></button>
    <div class="relative z-50 border-t border-[#0E3A40]/10 bg-[#F2EBDD] px-5 pb-6 pt-2 shadow-lg shadow-[#1C2B2E]/5">
      <ul class="flex flex-col">
        <li><a href="#work" data-nav-link class="block border-b border-[#0E3A40]/10 py-3 text-base font-medium text-[#0E3A40] transition-colors hover:text-[#FF6F59]">Work</a></li>
        <li><a href="#services" data-nav-link class="block border-b border-[#0E3A40]/10 py-3 text-base font-medium text-[#0E3A40] transition-colors hover:text-[#FF6F59]">Services</a></li>
        <li><a href="#process" data-nav-link class="block border-b border-[#0E3A40]/10 py-3 text-base font-medium text-[#0E3A40] transition-colors hover:text-[#FF6F59]">Process</a></li>
        <li><a href="#pricing" data-nav-link class="block border-b border-[#0E3A40]/10 py-3 text-base font-medium text-[#0E3A40] transition-colors hover:text-[#FF6F59]">Pricing</a></li>
      </ul>
      <div class="mt-5 flex flex-col gap-3">
        <a href="#signin" data-nav-link class="rounded-xl border border-[#0E3A40]/15 px-4 py-3 text-center text-sm font-semibold text-[#0E3A40] transition-colors hover:bg-[#0E3A40]/5">Sign in</a>
        <a href="#contact" data-nav-link class="rounded-xl bg-[#FF6F59] px-4 py-3 text-center text-sm font-semibold text-[#1C2B2E] shadow-sm transition-all hover:-translate-y-0.5 hover:shadow-md hover:shadow-[#FF6F59]/30">Start a project</a>
      </div>
    </div>
  </div>
</header>

<!-- Behavior: hamburger toggle, scroll elevation, Escape to close. Include once. -->
<script>
  (function () {
    var header = document.getElementById("scs-navbar");
    var toggle = document.getElementById("scs-nav-toggle");
    var menu = document.getElementById("scs-mobile-menu");
    if (!header || !toggle || !menu) return;

    var bars = {
      top: menu.parentElement.querySelector('[data-bar="top"]'),
      mid: menu.parentElement.querySelector('[data-bar="mid"]'),
      bot: menu.parentElement.querySelector('[data-bar="bot"]'),
    };

    function setOpen(open) {
      menu.classList.toggle("hidden", !open);
      toggle.setAttribute("aria-expanded", String(open));
      toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
      document.body.style.overflow = open ? "hidden" : "";
      // Animate the hamburger into an X.
      if (bars.top) bars.top.classList.toggle("-translate-y-1.5", !open);
      if (bars.top) bars.top.classList.toggle("rotate-45", open);
      if (bars.top) bars.top.classList.toggle("-translate-y-1/2", open);
      if (bars.mid) bars.mid.classList.toggle("opacity-0", open);
      if (bars.bot) bars.bot.classList.toggle("translate-y-1.5", !open);
      if (bars.bot) bars.bot.classList.toggle("-rotate-45", open);
      if (bars.bot) bars.bot.classList.toggle("-translate-y-1/2", open);
    }

    toggle.addEventListener("click", function () {
      setOpen(menu.classList.contains("hidden"));
    });

    menu.querySelectorAll("[data-nav-link]").forEach(function (a) {
      a.addEventListener("click", function () { setOpen(false); });
    });

    var backdrop = menu.querySelector("[data-nav-backdrop]");
    if (backdrop) backdrop.addEventListener("click", function () { setOpen(false); });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !menu.classList.contains("hidden")) setOpen(false);
    });

    function onScroll() {
      var s = window.scrollY > 8;
      header.classList.toggle("bg-[#F2EBDD]/85", s);
      header.classList.toggle("backdrop-blur-md", s);
      header.classList.toggle("border-[#0E3A40]/10", s);
      header.classList.toggle("bg-[#F2EBDD]", !s);
      header.classList.toggle("border-transparent", !s);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
</script>
