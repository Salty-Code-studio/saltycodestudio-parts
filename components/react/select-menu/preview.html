<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Menu — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      @keyframes scs-select-pop {
        from { opacity: 0; transform: translateY(-4px) scale(0.985); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body class="bg-[#fbf7f0] text-[#1c2b33]">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      const { useCallback, useEffect, useMemo, useRef, useState } = React;

      const SIZES = {
        sm: { trigger: "h-9 px-3 text-sm", text: "text-sm" },
        md: { trigger: "h-11 px-3.5 text-[15px]", text: "text-[15px]" },
        lg: { trigger: "h-12 px-4 text-base", text: "text-base" },
      };

      let idCounter = 0;
      function useId(prefix, override) {
        const ref = useRef();
        if (!ref.current) ref.current = override || `${prefix}-${++idCounter}`;
        return ref.current;
      }

      function SelectMenu({
        options,
        value: controlledValue,
        defaultValue = null,
        onChange,
        placeholder = "Select an option",
        searchable = false,
        searchPlaceholder = "Search…",
        disabled = false,
        label,
        id,
        className = "",
        size = "md",
      }) {
        const isControlled = controlledValue !== undefined;
        const [uncontrolled, setUncontrolled] = useState(defaultValue);
        const value = isControlled ? controlledValue : uncontrolled;

        const [open, setOpen] = useState(false);
        const [query, setQuery] = useState("");
        const [activeIndex, setActiveIndex] = useState(-1);

        const rootRef = useRef(null);
        const triggerRef = useRef(null);
        const listRef = useRef(null);
        const searchRef = useRef(null);

        const triggerId = useId("scs-select-trigger", id);
        const listId = useId("scs-select-list");
        const labelId = useId("scs-select-label");

        const sz = SIZES[size];

        const filtered = useMemo(() => {
          if (!searchable || !query.trim()) return options;
          const q = query.trim().toLowerCase();
          return options.filter(
            (o) =>
              o.label.toLowerCase().includes(q) ||
              (o.description ? o.description.toLowerCase().includes(q) : false)
          );
        }, [options, query, searchable]);

        const selectedOption = useMemo(
          () => options.find((o) => o.value === value) || null,
          [options, value]
        );

        const firstEnabledIndex = useCallback(
          (list) => list.findIndex((o) => !o.disabled),
          []
        );

        const openMenu = useCallback(() => {
          if (disabled) return;
          setOpen(true);
          const selIdx = filtered.findIndex((o) => o.value === value && !o.disabled);
          setActiveIndex(selIdx >= 0 ? selIdx : firstEnabledIndex(filtered));
        }, [disabled, filtered, value, firstEnabledIndex]);

        const closeMenu = useCallback((focusTrigger = true) => {
          setOpen(false);
          setQuery("");
          setActiveIndex(-1);
          if (focusTrigger && triggerRef.current) triggerRef.current.focus();
        }, []);

        const commit = useCallback(
          (option) => {
            if (option.disabled) return;
            if (!isControlled) setUncontrolled(option.value);
            if (onChange) onChange(option.value);
            closeMenu();
          },
          [isControlled, onChange, closeMenu]
        );

        useEffect(() => {
          if (!open) return;
          function onPointerDown(e) {
            if (rootRef.current && !rootRef.current.contains(e.target)) closeMenu(false);
          }
          document.addEventListener("mousedown", onPointerDown);
          return () => document.removeEventListener("mousedown", onPointerDown);
        }, [open, closeMenu]);

        useEffect(() => {
          if (!open) return;
          if (searchable) { if (searchRef.current) searchRef.current.focus(); }
          else { if (listRef.current) listRef.current.focus(); }
        }, [open, searchable]);

        useEffect(() => {
          if (!open || activeIndex < 0) return;
          const node = listRef.current && listRef.current.querySelector(`[data-index="${activeIndex}"]`);
          if (node) node.scrollIntoView({ block: "nearest" });
        }, [open, activeIndex]);

        useEffect(() => {
          if (!open) return;
          setActiveIndex((prev) => {
            if (prev >= 0 && prev < filtered.length && filtered[prev] && !filtered[prev].disabled) return prev;
            return firstEnabledIndex(filtered);
          });
        }, [filtered, open, firstEnabledIndex]);

        const moveActive = useCallback(
          (dir) => {
            if (filtered.length === 0) return;
            setActiveIndex((prev) => {
              let next = prev;
              for (let i = 0; i < filtered.length; i++) {
                next = (next + dir + filtered.length) % filtered.length;
                if (!filtered[next].disabled) return next;
              }
              return prev;
            });
          },
          [filtered]
        );

        const onListKeyDown = useCallback(
          (e) => {
            switch (e.key) {
              case "ArrowDown":
                e.preventDefault();
                if (!open) return openMenu();
                moveActive(1);
                break;
              case "ArrowUp":
                e.preventDefault();
                if (!open) return openMenu();
                moveActive(-1);
                break;
              case "Home":
                if (open) { e.preventDefault(); setActiveIndex(firstEnabledIndex(filtered)); }
                break;
              case "End":
                if (open) {
                  e.preventDefault();
                  for (let i = filtered.length - 1; i >= 0; i--) {
                    if (!filtered[i].disabled) { setActiveIndex(i); break; }
                  }
                }
                break;
              case "Enter":
                if (open && activeIndex >= 0 && filtered[activeIndex]) { e.preventDefault(); commit(filtered[activeIndex]); }
                break;
              case "Tab":
                if (open) closeMenu(false);
                break;
              case "Escape":
                if (open) { e.preventDefault(); closeMenu(); }
                break;
              default:
                break;
            }
          },
          [open, openMenu, moveActive, firstEnabledIndex, filtered, activeIndex, commit, closeMenu]
        );

        const onTriggerKeyDown = useCallback(
          (e) => {
            if (disabled) return;
            if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); openMenu(); return; }
            if ((e.key === "Enter" || e.key === " ") && !open) { e.preventDefault(); openMenu(); return; }
            if (!searchable) onListKeyDown(e);
          },
          [disabled, open, openMenu, searchable, onListKeyDown]
        );

        const activeId = open && activeIndex >= 0 && filtered[activeIndex]
          ? `${listId}-opt-${activeIndex}`
          : undefined;

        return (
          <div ref={rootRef} className={`relative w-full max-w-xs ${className}`}>
            {label && (
              <span id={labelId} className="mb-1.5 block text-sm font-medium text-[#1c2b33]">
                {label}
              </span>
            )}

            <button
              ref={triggerRef}
              id={triggerId}
              type="button"
              disabled={disabled}
              aria-haspopup="listbox"
              aria-expanded={open}
              aria-controls={open ? listId : undefined}
              aria-labelledby={label ? `${labelId} ${triggerId}` : undefined}
              aria-label={!label ? placeholder : undefined}
              onClick={() => (open ? closeMenu() : openMenu())}
              onKeyDown={onTriggerKeyDown}
              className={[
                "flex w-full items-center justify-between gap-2 rounded-xl border bg-[#fbf7f0] text-left",
                "transition-colors duration-150 outline-none",
                "border-[#e2d6c2] text-[#1c2b33]",
                "hover:border-[#cdbfa6] hover:bg-[#f4ece0]",
                "focus-visible:border-[#1f8a8a] focus-visible:ring-2 focus-visible:ring-[#2ec3c3]/45",
                "disabled:cursor-not-allowed disabled:opacity-55 disabled:hover:bg-[#fbf7f0]",
                open ? "border-[#1f8a8a] ring-2 ring-[#2ec3c3]/40" : "",
                sz.trigger,
              ].join(" ")}
            >
              <span className="flex min-w-0 items-center gap-2">
                {selectedOption && selectedOption.icon && (
                  <span aria-hidden="true" className="text-base leading-none">{selectedOption.icon}</span>
                )}
                <span className={`truncate ${selectedOption ? "text-[#1c2b33]" : "text-[#90a0a8]"}`}>
                  {selectedOption ? selectedOption.label : placeholder}
                </span>
              </span>
              <svg
                aria-hidden="true"
                viewBox="0 0 20 20"
                className={`h-4 w-4 shrink-0 text-[#4a5d66] transition-transform duration-200 ${open ? "rotate-180" : ""}`}
                fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"
              >
                <path d="M5 7.5 10 12.5 15 7.5" />
              </svg>
            </button>

            {open && (
              <div
                className="absolute z-50 mt-2 w-full overflow-hidden rounded-xl border border-[#e2d6c2] bg-[#fbf7f0] shadow-xl shadow-[#1c2b33]/10"
                style={{ animation: "scs-select-pop 140ms cubic-bezier(0.16,1,0.3,1)" }}
              >
                {searchable && (
                  <div className="border-b border-[#ece0cd] p-2">
                    <input
                      ref={searchRef}
                      type="text"
                      value={query}
                      onChange={(e) => setQuery(e.target.value)}
                      onKeyDown={onListKeyDown}
                      placeholder={searchPlaceholder}
                      aria-label={searchPlaceholder}
                      aria-controls={listId}
                      aria-activedescendant={activeId}
                      autoComplete="off"
                      className={[
                        "w-full rounded-lg border border-[#e2d6c2] bg-[#f4ece0] px-3 py-2",
                        "text-[#1c2b33] placeholder:text-[#90a0a8] outline-none",
                        "focus-visible:border-[#1f8a8a] focus-visible:ring-2 focus-visible:ring-[#2ec3c3]/40",
                        "text-sm",
                      ].join(" ")}
                    />
                  </div>
                )}

                <ul
                  ref={listRef}
                  id={listId}
                  role="listbox"
                  tabIndex={searchable ? -1 : 0}
                  aria-labelledby={label ? labelId : undefined}
                  aria-activedescendant={activeId}
                  onKeyDown={searchable ? undefined : onListKeyDown}
                  className="max-h-60 overflow-y-auto p-1 outline-none"
                >
                  {filtered.length === 0 && (
                    <li role="presentation" className="px-3 py-6 text-center text-sm text-[#90a0a8]">
                      No matches found
                    </li>
                  )}

                  {filtered.map((option, index) => {
                    const selected = option.value === value;
                    const active = index === activeIndex;
                    return (
                      <li
                        key={option.value}
                        id={`${listId}-opt-${index}`}
                        data-index={index}
                        role="option"
                        aria-selected={selected}
                        aria-disabled={option.disabled || undefined}
                        onMouseEnter={() => !option.disabled && setActiveIndex(index)}
                        onClick={() => commit(option)}
                        className={[
                          "flex cursor-pointer items-center gap-2.5 rounded-lg px-3 py-2",
                          sz.text,
                          option.disabled ? "cursor-not-allowed opacity-45" : "",
                          active && !option.disabled ? "bg-[#1f8a8a] text-white" : "text-[#1c2b33]",
                          !active && selected ? "bg-[#e6f4f4]" : "",
                        ].join(" ")}
                      >
                        {option.icon && (
                          <span aria-hidden="true" className="text-base leading-none">{option.icon}</span>
                        )}
                        <span className="min-w-0 flex-1">
                          <span className="block truncate font-medium">{option.label}</span>
                          {option.description && (
                            <span className={`block truncate text-xs ${active && !option.disabled ? "text-white/80" : "text-[#4a5d66]"}`}>
                              {option.description}
                            </span>
                          )}
                        </span>
                        {selected && (
                          <svg
                            aria-hidden="true"
                            viewBox="0 0 20 20"
                            className={`h-4 w-4 shrink-0 ${active ? "text-white" : "text-[#0f5c5c]"}`}
                            fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
                          >
                            <path d="m4 10.5 4 4 8-9" />
                          </svg>
                        )}
                      </li>
                    );
                  })}
                </ul>
              </div>
            )}
          </div>
        );
      }

      /* --------------------------- demo data --------------------------- */
      const ISLANDS = [
        { value: "bonaire", label: "Bonaire", description: "Home base · ABC islands", icon: "🏝️" },
        { value: "curacao", label: "Curaçao", description: "Willemstad", icon: "🌊" },
        { value: "aruba", label: "Aruba", description: "One happy island", icon: "🐠" },
        { value: "saba", label: "Saba", description: "The unspoiled queen", icon: "⛰️" },
        { value: "statia", label: "Sint Eustatius", description: "Closed for the season", icon: "🌋", disabled: true },
        { value: "sxm", label: "Sint Maarten", description: "Dutch + French", icon: "✈️" },
      ];

      const PLANS = [
        { value: "tide", label: "Tide", description: "Free — 1 project" },
        { value: "surf", label: "Surf", description: "$12/mo — 10 projects" },
        { value: "current", label: "Current", description: "$29/mo — unlimited" },
        { value: "deep", label: "Deep Blue", description: "Enterprise" },
      ];

      function Panel({ title, hint, children }) {
        return (
          <section className="rounded-2xl border border-[#ece0cd] bg-[#f4ece0]/60 p-6">
            <h2 className="text-sm font-semibold uppercase tracking-wide text-[#0f5c5c]">{title}</h2>
            {hint && <p className="mt-1 text-sm text-[#4a5d66]">{hint}</p>}
            <div className="mt-4">{children}</div>
          </section>
        );
      }

      function Demo() {
        const [plan, setPlan] = useState("surf");
        const [controlledIsland, setControlledIsland] = useState("bonaire");

        return (
          <main className="mx-auto max-w-3xl px-6 py-14">
            <header className="mb-10">
              <p className="text-sm font-medium tracking-wide text-[#1f8a8a]">saltycodestudio · parts</p>
              <h1 className="mt-1 text-3xl font-semibold text-[#1c2b33]">Select Menu</h1>
              <p className="mt-2 max-w-xl text-[#4a5d66]">
                Accessible listbox dropdown — keyboard nav (↑ ↓ Home End Enter Esc), optional search,
                checkmark on the selected option, disabled rows, controlled &amp; uncontrolled. Sand &amp; Surf palette.
              </p>
            </header>

            <div className="grid gap-6 sm:grid-cols-2">
              <Panel title="Default" hint="Uncontrolled, icons + descriptions. One row disabled.">
                <SelectMenu
                  label="Pick an island"
                  options={ISLANDS}
                  placeholder="Choose an island"
                  defaultValue={null}
                />
              </Panel>

              <Panel title="Searchable" hint="Type to filter by label or description.">
                <SelectMenu
                  label="Find an island"
                  options={ISLANDS}
                  searchable
                  searchPlaceholder="Search islands…"
                  placeholder="Search &amp; select"
                />
              </Panel>

              <Panel title="Controlled + pre-selected" hint={`Current value: ${controlledIsland}`}>
                <SelectMenu
                  label="Destination"
                  options={ISLANDS}
                  value={controlledIsland}
                  onChange={setControlledIsland}
                />
              </Panel>

              <Panel title="Disabled control" hint="Whole select is disabled.">
                <SelectMenu
                  label="Locked field"
                  options={PLANS}
                  defaultValue="surf"
                  disabled
                />
              </Panel>

              <Panel title="Small" hint="size=&quot;sm&quot;">
                <SelectMenu size="sm" options={PLANS} defaultValue="tide" placeholder="Plan" />
              </Panel>

              <Panel title="Large" hint="size=&quot;lg&quot;, controlled">
                <SelectMenu
                  size="lg"
                  options={PLANS}
                  value={plan}
                  onChange={setPlan}
                  placeholder="Choose a plan"
                />
              </Panel>
            </div>

            <p className="mt-10 text-center text-xs text-[#90a0a8]">
              Click a trigger or focus it and press ↓ / Enter. All variants are fully keyboard operable.
            </p>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
