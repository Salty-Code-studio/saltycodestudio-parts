<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badge / Tag — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body class="bg-[#fbf7f0]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState } = React;

      /* ---- style maps (mirrors BadgeTag.tsx) ---- */
      const SIZE = {
        sm: { container: "h-5 gap-1 px-2 text-[11px]", dot: "h-1.5 w-1.5", remove: "-mr-0.5 ml-0.5 h-3.5 w-3.5", removeIcon: "h-2.5 w-2.5" },
        md: { container: "h-6 gap-1.5 px-2.5 text-xs", dot: "h-2 w-2", remove: "-mr-1 ml-0.5 h-4 w-4", removeIcon: "h-3 w-3" },
        lg: { container: "h-7 gap-1.5 px-3 text-sm", dot: "h-2.5 w-2.5", remove: "-mr-1 ml-1 h-5 w-5", removeIcon: "h-3.5 w-3.5" },
      };
      const SOLID = {
        neutral: { fill: "bg-[#f4ece0]", text: "text-[#1c2b33]", ring: "ring-1 ring-inset ring-[#1c2b33]/10", dot: "bg-[#4a5d66]", removeHover: "hover:bg-[#1c2b33]/10 hover:text-[#1c2b33]", focus: "focus-visible:ring-[#4a5d66]" },
        ocean:   { fill: "bg-[#2ec3c3]/15", text: "text-[#0f5c5c]", ring: "ring-1 ring-inset ring-[#1f8a8a]/25", dot: "bg-[#1f8a8a]", removeHover: "hover:bg-[#1f8a8a]/15 hover:text-[#0f5c5c]", focus: "focus-visible:ring-[#1f8a8a]" },
        success: { fill: "bg-emerald-500/15", text: "text-emerald-800", ring: "ring-1 ring-inset ring-emerald-600/25", dot: "bg-emerald-600", removeHover: "hover:bg-emerald-600/15 hover:text-emerald-900", focus: "focus-visible:ring-emerald-600" },
        warning: { fill: "bg-amber-400/20", text: "text-amber-800", ring: "ring-1 ring-inset ring-amber-500/30", dot: "bg-amber-500", removeHover: "hover:bg-amber-500/20 hover:text-amber-900", focus: "focus-visible:ring-amber-500" },
        danger:  { fill: "bg-rose-500/15", text: "text-rose-800", ring: "ring-1 ring-inset ring-rose-600/25", dot: "bg-rose-600", removeHover: "hover:bg-rose-600/15 hover:text-rose-900", focus: "focus-visible:ring-rose-600" },
        info:    { fill: "bg-sky-500/15", text: "text-sky-800", ring: "ring-1 ring-inset ring-sky-600/25", dot: "bg-sky-600", removeHover: "hover:bg-sky-600/15 hover:text-sky-900", focus: "focus-visible:ring-sky-600" },
      };
      const OUTLINE = {
        neutral: { text: "text-[#4a5d66]", ring: "ring-1 ring-inset ring-[#1c2b33]/20" },
        ocean:   { text: "text-[#0f5c5c]", ring: "ring-1 ring-inset ring-[#1f8a8a]/45" },
        success: { text: "text-emerald-800", ring: "ring-1 ring-inset ring-emerald-600/45" },
        warning: { text: "text-amber-800", ring: "ring-1 ring-inset ring-amber-500/55" },
        danger:  { text: "text-rose-800", ring: "ring-1 ring-inset ring-rose-600/45" },
        info:    { text: "text-sky-800", ring: "ring-1 ring-inset ring-sky-600/45" },
      };
      const cx = (...p) => p.filter(Boolean).join(" ");

      function BadgeTag({ variant = "neutral", size = "md", pill = true, dot = false, outline = false, onRemove, removeLabel, children, className, ...rest }) {
        const sizing = SIZE[size];
        const solid = SOLID[variant];
        const out = OUTLINE[variant];
        const tone = outline ? cx("bg-transparent", out.text, out.ring) : cx(solid.fill, solid.text, solid.ring);
        const label = removeLabel || (typeof children === "string" ? `Remove ${children}` : "Remove");
        return (
          <span
            className={cx(
              "inline-flex select-none items-center whitespace-nowrap align-middle font-medium leading-none",
              pill ? "rounded-full" : "rounded-md",
              sizing.container, tone, className
            )}
            {...rest}
          >
            {dot ? <span aria-hidden="true" className={cx("shrink-0 rounded-full", sizing.dot, solid.dot)} /> : null}
            <span className="truncate">{children}</span>
            {onRemove ? (
              <button
                type="button"
                onClick={onRemove}
                aria-label={label}
                className={cx(
                  "inline-flex shrink-0 items-center justify-center rounded-full outline-none transition-colors",
                  "focus-visible:ring-2 focus-visible:ring-offset-1 focus-visible:ring-offset-transparent",
                  sizing.remove, solid.removeHover, solid.focus
                )}
              >
                <svg className={sizing.removeIcon} viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" aria-hidden="true">
                  <path d="M3 3l6 6M9 3l-6 6" />
                </svg>
              </button>
            ) : null}
          </span>
        );
      }

      const VARIANTS = ["neutral", "ocean", "success", "warning", "danger", "info"];

      function Row({ title, children }) {
        return (
          <div className="border-b border-[#ece0cd] py-6 last:border-0">
            <h3 className="mb-3 text-xs font-semibold uppercase tracking-wider text-[#4a5d66]">{title}</h3>
            <div className="flex flex-wrap items-center gap-2.5">{children}</div>
          </div>
        );
      }

      function Demo() {
        const [tags, setTags] = useState([
          { id: 1, label: "React", variant: "ocean" },
          { id: 2, label: "TypeScript", variant: "info" },
          { id: 3, label: "Tailwind", variant: "ocean" },
          { id: 4, label: "Accessible", variant: "success" },
          { id: 5, label: "Deprecated", variant: "danger" },
        ]);

        return (
          <main className="mx-auto max-w-3xl px-6 py-16">
            <header className="mb-8">
              <span className="text-xs font-semibold uppercase tracking-[0.2em] text-[#1f8a8a]">saltycodestudio</span>
              <h1 className="mt-2 text-3xl font-semibold tracking-tight text-[#1c2b33]">Badge / Tag</h1>
              <p className="mt-2 max-w-prose text-sm text-[#4a5d66]">
                Semantic color variants, three sizes, status dots, an outline treatment, and removable tags — all on the Sand &amp; Surf palette.
              </p>
            </header>

            <section className="rounded-2xl border border-[#ece0cd] bg-[#fdfbf7] px-6 ring-1 ring-inset ring-white/60">
              <Row title="Semantic variants (soft)">
                {VARIANTS.map((v) => (
                  <BadgeTag key={v} variant={v}>{v.charAt(0).toUpperCase() + v.slice(1)}</BadgeTag>
                ))}
              </Row>

              <Row title="Outline variants">
                {VARIANTS.map((v) => (
                  <BadgeTag key={v} variant={v} outline>{v.charAt(0).toUpperCase() + v.slice(1)}</BadgeTag>
                ))}
              </Row>

              <Row title="With status dot">
                <BadgeTag variant="success" dot>Live</BadgeTag>
                <BadgeTag variant="warning" dot>Pending</BadgeTag>
                <BadgeTag variant="danger" dot>Offline</BadgeTag>
                <BadgeTag variant="ocean" dot>Syncing</BadgeTag>
                <BadgeTag variant="neutral" dot outline>Draft</BadgeTag>
              </Row>

              <Row title="Sizes (sm · md · lg)">
                <BadgeTag variant="ocean" size="sm" dot>Small</BadgeTag>
                <BadgeTag variant="ocean" size="md" dot>Medium</BadgeTag>
                <BadgeTag variant="ocean" size="lg" dot>Large</BadgeTag>
              </Row>

              <Row title="Square corners (pill={false})">
                <BadgeTag variant="info" pill={false}>v4.2.0</BadgeTag>
                <BadgeTag variant="neutral" pill={false}>SHA c0ffee</BadgeTag>
                <BadgeTag variant="success" pill={false} outline>passing</BadgeTag>
              </Row>

              <Row title="Removable (try Tab + Enter)">
                {tags.length === 0 ? (
                  <span className="text-sm italic text-[#4a5d66]">All tags removed — refresh to reset.</span>
                ) : (
                  tags.map((t) => (
                    <BadgeTag
                      key={t.id}
                      variant={t.variant}
                      onRemove={() => setTags((prev) => prev.filter((x) => x.id !== t.id))}
                    >
                      {t.label}
                    </BadgeTag>
                  ))
                )}
              </Row>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
