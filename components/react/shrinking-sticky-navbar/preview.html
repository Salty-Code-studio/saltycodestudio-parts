<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shrinking Sticky Navbar — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style> body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; } </style>
  </head>
  <body class="bg-[#faf6ef]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useEffect, useState } = React;

      const DEFAULT_LINKS = [
        { label: "Work", href: "#work" },
        { label: "Services", href: "#services" },
        { label: "Studio", href: "#studio" },
        { label: "Journal", href: "#journal" },
      ];

      function ShrinkingStickyNavbar({ brand = "saltycodestudio", links = DEFAULT_LINKS, ctaLabel = "Start a project", ctaHref = "#contact", threshold = 24, className = "" }) {
        const [scrolled, setScrolled] = useState(false);
        useEffect(() => {
          const onScroll = () => setScrolled(window.scrollY > threshold);
          onScroll();
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => window.removeEventListener("scroll", onScroll);
        }, [threshold]);
        return (
          <header className={`sticky top-0 z-50 w-full transition-all duration-300 ease-out ${scrolled ? "border-b border-[#e7ddcd]/80 bg-[#faf6ef]/80 backdrop-blur-xl shadow-sm" : "border-b border-transparent bg-transparent"} ${className}`}>
            <nav className={`mx-auto flex max-w-6xl items-center justify-between px-6 transition-all duration-300 ease-out ${scrolled ? "h-14" : "h-20"}`}>
              <a href="#" className="flex items-center gap-2">
                <span className={`grid place-items-center rounded-xl bg-[#1c2b33] font-mono font-bold text-amber-200 transition-all duration-300 ${scrolled ? "h-7 w-7 text-sm" : "h-9 w-9 text-base"}`} aria-hidden="true">~&lt;</span>
                <span className={`font-semibold tracking-tight text-[#1c2b33] transition-all duration-300 ${scrolled ? "text-base" : "text-lg"}`}>{brand}</span>
              </a>
              <ul className="hidden items-center gap-8 md:flex">
                {links.map((link) => (
                  <li key={link.href}><a href={link.href} className="text-sm font-medium text-[#42525a] transition-colors hover:text-teal-700">{link.label}</a></li>
                ))}
              </ul>
              <a href={ctaHref} className={`rounded-full bg-teal-700 font-semibold text-white shadow-sm transition-all duration-300 hover:bg-teal-800 ${scrolled ? "px-4 py-2 text-sm" : "px-5 py-2.5 text-sm"}`}>{ctaLabel}</a>
            </nav>
          </header>
        );
      }

      function Demo() {
        return (
          <div>
            <ShrinkingStickyNavbar />
            <main className="mx-auto max-w-3xl px-6 py-20">
              <h1 className="text-4xl font-semibold tracking-tight text-[#1c2b33]">Scroll to watch the navbar condense</h1>
              <p className="mt-4 text-[#5b6b72]">As you scroll past the threshold, the header shrinks its height, swaps the logo scale, and gains a frosted backdrop blur.</p>
              {Array.from({ length: 14 }).map((_, i) => (
                <p key={i} className="mt-6 leading-relaxed text-[#5b6b72]">
                  Section {i + 1}. The ocean teal accent and warm sand background keep the chrome calm and premium. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam.
                </p>
              ))}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
