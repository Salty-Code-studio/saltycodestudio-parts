<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Glow Border — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* Sand & Surf glow tokens used by the conic-gradient ring. */
      .hgb {
        --hgb-angle: 0deg;
        --hgb-active: 0;
        --hgb-border: 1.5px;
        --hgb-spread: 40deg;
        --hgb-surf: rgba(46, 195, 195, 0.35); /* surf teal, soft */
        --hgb-glow: #1f8a8a; /* ocean accent hotspot */
        position: relative;
        isolation: isolate;
      }
      .hgb::before,
      .hgb::after {
        content: "";
        position: absolute;
        border-radius: inherit;
        pointer-events: none;
      }
      /* Masked border ring. */
      .hgb::before {
        inset: 0;
        padding: var(--hgb-border);
        background: conic-gradient(
          from var(--hgb-angle),
          transparent 0deg,
          var(--hgb-surf) calc(180deg - var(--hgb-spread)),
          var(--hgb-glow) 180deg,
          var(--hgb-surf) calc(180deg + var(--hgb-spread)),
          transparent 360deg
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: calc(0.45 + 0.55 * var(--hgb-active));
        transition: opacity 0.5s ease;
      }
      /* Outer bloom. */
      .hgb::after {
        inset: -1px;
        background: conic-gradient(
          from var(--hgb-angle),
          transparent 0deg,
          transparent calc(180deg - var(--hgb-spread)),
          var(--hgb-glow) 180deg,
          transparent calc(180deg + var(--hgb-spread)),
          transparent 360deg
        );
        opacity: calc(0.25 * var(--hgb-active));
        filter: blur(10px);
        transition: opacity 0.5s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .hgb::before,
        .hgb::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="bg-[#fbf7f0] text-[#1c2b33]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useCallback, useEffect, useRef } = React;

      // Tiny tween (stand-in for motion's `animate`) so the preview is fully
      // standalone. Eases `from`->`to` over `duration` seconds.
      function tween(from, to, duration, onUpdate) {
        const start = performance.now();
        const ease = (t) =>
          // expo-ish ease-out matching the .tsx cubic-bezier(0.16,1,0.3,1)
          t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
        let raf;
        const step = (now) => {
          const t = Math.min(1, (now - start) / (duration * 1000));
          onUpdate(from + (to - from) * ease(t));
          if (t < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }

      function HoverGlowBorder({
        borderWidth = 1.5,
        spread = 40,
        proximity = 64,
        inactiveZone = 0.01,
        movementDuration = 2,
        disabled = false,
        className = "",
        children,
      }) {
        const containerRef = useRef(null);
        const angleRef = useRef(0);
        const lastPointer = useRef(null);
        const rafId = useRef(null);
        const cancelTween = useRef(null);
        const reducedMotion = useRef(false);

        const handleMove = useCallback(
          (clientX, clientY) => {
            const el = containerRef.current;
            if (!el) return;
            if (rafId.current !== null) cancelAnimationFrame(rafId.current);
            rafId.current = requestAnimationFrame(() => {
              const rect = el.getBoundingClientRect();
              const cx = rect.left + rect.width / 2;
              const cy = rect.top + rect.height / 2;
              const dx = clientX - cx;
              const dy = clientY - cy;
              const dist = Math.hypot(dx, dy);

              const deadRadius =
                inactiveZone * Math.min(rect.width, rect.height) * 0.5;
              if (dist < deadRadius) return;

              const edgeDist = Math.max(
                0,
                dist - Math.hypot(rect.width, rect.height) / 2
              );
              const active = edgeDist <= proximity;
              el.style.setProperty("--hgb-active", active ? "1" : "0");

              const target = (Math.atan2(dy, dx) * 180) / Math.PI + 90;
              const current = angleRef.current;
              const delta = ((((target - current) % 360) + 540) % 360) - 180;
              const next = current + delta;

              if (cancelTween.current) cancelTween.current();
              if (reducedMotion.current) {
                angleRef.current = next;
                el.style.setProperty("--hgb-angle", next + "deg");
                return;
              }
              cancelTween.current = tween(
                current,
                next,
                movementDuration,
                (v) => {
                  angleRef.current = v;
                  el.style.setProperty("--hgb-angle", v + "deg");
                }
              );
            });
          },
          [inactiveZone, proximity, movementDuration]
        );

        useEffect(() => {
          reducedMotion.current = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches;
          if (disabled) return;
          const onMove = (e) => {
            lastPointer.current = { x: e.clientX, y: e.clientY };
            handleMove(e.clientX, e.clientY);
          };
          const onScroll = () => {
            if (lastPointer.current)
              handleMove(lastPointer.current.x, lastPointer.current.y);
          };
          window.addEventListener("pointermove", onMove, { passive: true });
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("scroll", onScroll);
            if (rafId.current !== null) cancelAnimationFrame(rafId.current);
            if (cancelTween.current) cancelTween.current();
          };
        }, [disabled, handleMove]);

        const style = {
          "--hgb-border": borderWidth + "px",
          "--hgb-spread": spread + "deg",
        };

        return (
          <div
            ref={containerRef}
            className={"hgb rounded-2xl " + className}
            style={style}
          >
            {children}
          </div>
        );
      }

      function GlowCard({ kicker, title, body, spread, proximity }) {
        return (
          <HoverGlowBorder
            spread={spread}
            proximity={proximity}
            className="h-full"
          >
            <div className="h-full rounded-2xl bg-[#f4ece0] p-7 ring-1 ring-[#ece0cd]">
              <span className="inline-flex items-center rounded-full bg-[#1f8a8a]/10 px-3 py-1 text-xs font-medium tracking-wide text-[#0f5c5c]">
                {kicker}
              </span>
              <h3 className="mt-4 text-xl font-semibold tracking-tight text-[#1c2b33]">
                {title}
              </h3>
              <p className="mt-2 text-sm leading-relaxed text-[#4a5d66]">
                {body}
              </p>
              <div className="mt-6 flex items-center gap-2 text-sm font-medium text-[#1f8a8a]">
                Explore
                <span aria-hidden="true">&rarr;</span>
              </div>
            </div>
          </HoverGlowBorder>
        );
      }

      const CARDS = [
        {
          kicker: "Edge motion",
          title: "Pointer-aware ring",
          body: "The glow tracks the angle from this card's center to your cursor and eases toward it with a weighted tween.",
          spread: 40,
          proximity: 80,
        },
        {
          kicker: "Tight hotspot",
          title: "Lower spread",
          body: "A smaller spread concentrates the light into a brighter, narrower hotspot that chases the pointer.",
          spread: 22,
          proximity: 80,
        },
        {
          kicker: "Wide wash",
          title: "Higher spread",
          body: "A larger spread softens the glow into a broad wash of surf teal that wraps most of the border.",
          spread: 80,
          proximity: 120,
        },
        {
          kicker: "Any size",
          title: "Container-agnostic",
          body: "The mask-composite border ring adapts to any width or height with zero layout math, so it just works.",
          spread: 40,
          proximity: 80,
        },
      ];

      function Demo() {
        return (
          <div className="mx-auto max-w-5xl px-6 py-20">
            <header className="mb-12 text-center">
              <p className="text-sm font-medium uppercase tracking-[0.2em] text-[#2ec3c3]">
                saltycodestudio
              </p>
              <h1 className="mt-3 text-4xl font-semibold tracking-tight text-[#1c2b33] sm:text-5xl">
                Hover Glow Border
              </h1>
              <p className="mx-auto mt-4 max-w-xl text-[#4a5d66]">
                Move your cursor around these cards. A conic-gradient ring orbits
                each one and concentrates toward the pointer.
              </p>
            </header>

            <div className="grid grid-cols-1 gap-6 sm:grid-cols-2">
              {CARDS.map((c) => (
                <GlowCard key={c.title} {...c} />
              ))}
            </div>

            <div className="mt-6">
              <HoverGlowBorder spread={50} proximity={120}>
                <div className="rounded-2xl bg-[#ece0cd] p-8 ring-1 ring-[#e0d2bb]">
                  <h2 className="text-2xl font-semibold tracking-tight text-[#1c2b33]">
                    Drop it on any panel
                  </h2>
                  <p className="mt-2 max-w-2xl text-sm leading-relaxed text-[#4a5d66]">
                    Wrap a hero, a CTA, a pricing tile — the ring inherits the
                    border radius and stretches to fill, no matter the aspect
                    ratio.
                  </p>
                  <button className="mt-6 rounded-lg bg-[#0f5c5c] px-5 py-2.5 text-sm font-medium text-[#fbf7f0] transition-colors hover:bg-[#1f8a8a]">
                    Get the snippet
                  </button>
                </div>
              </HoverGlowBorder>
            </div>

            <p className="mt-10 text-center text-xs text-[#9aa6ab]">
              Respects prefers-reduced-motion — the ring snaps instead of easing.
            </p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
