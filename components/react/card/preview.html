<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body class="bg-[#fbf7f0]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const cx = (...p) => p.filter(Boolean).join(" ");

      /* ---- style maps (mirrors Card.tsx) ---- */
      const VARIANT = {
        solid: "bg-[#fdfbf7] ring-1 ring-inset ring-[#ece0cd]",
        soft: "bg-[#f4ece0] ring-1 ring-inset ring-[#1c2b33]/[0.06]",
        outline: "bg-transparent ring-1 ring-inset ring-[#1c2b33]/15",
      };
      const PADDING = { none: "", sm: "px-4 py-3", md: "px-5 py-4", lg: "px-6 py-5" };
      const RATIO = { "16/9": "aspect-[16/9]", "4/3": "aspect-[4/3]", "1/1": "aspect-square", "3/2": "aspect-[3/2]" };

      function Card({ variant = "solid", hoverLift = false, href, external = false, children, className, ...rest }) {
        const base = cx(
          "group/card relative flex flex-col overflow-hidden rounded-2xl",
          "text-left transition-all duration-300 ease-out motion-reduce:transition-none",
          VARIANT[variant],
          hoverLift && cx(
            "shadow-[0_1px_2px_rgba(28,43,51,0.04)]",
            "hover:-translate-y-1 hover:shadow-[0_18px_40px_-12px_rgba(15,92,92,0.28)] hover:ring-[#1f8a8a]/35",
            "focus-visible:-translate-y-1 focus-visible:shadow-[0_18px_40px_-12px_rgba(15,92,92,0.28)]",
            "motion-reduce:hover:translate-y-0 motion-reduce:focus-visible:translate-y-0"
          ),
          href && "outline-none focus-visible:ring-2 focus-visible:ring-[#1f8a8a] focus-visible:ring-offset-2 focus-visible:ring-offset-[#fbf7f0]",
          className
        );
        if (href) {
          return (
            <a href={href} className={base} {...(external ? { target: "_blank", rel: "noopener noreferrer" } : null)} {...rest}>
              {children}
            </a>
          );
        }
        return <div className={base} {...rest}>{children}</div>;
      }

      function CardMedia({ src, alt, ratio = "16/9", overlay, className, ...rest }) {
        return (
          <div className={cx("relative w-full overflow-hidden bg-[#ece0cd]", RATIO[ratio])}>
            <img
              src={src}
              alt={alt}
              loading="lazy"
              decoding="async"
              className={cx(
                "h-full w-full object-cover transition-transform duration-500 ease-out",
                "group-hover/card:scale-[1.04] motion-reduce:transform-none motion-reduce:transition-none",
                className
              )}
              {...rest}
            />
            {overlay ? (
              <div className="pointer-events-none absolute left-3 top-3 flex gap-2 [&>*]:pointer-events-auto">{overlay}</div>
            ) : null}
          </div>
        );
      }

      function CardHeader({ eyebrow, title, subtitle, action, as: Heading = "h3", padding = "lg", className, children, ...rest }) {
        return (
          <div className={cx("flex items-start gap-3", PADDING[padding], className)} {...rest}>
            <div className="min-w-0 flex-1">
              {eyebrow ? <p className="mb-1 text-xs font-semibold uppercase tracking-[0.14em] text-[#1f8a8a]">{eyebrow}</p> : null}
              {title ? <Heading className="truncate text-lg font-semibold leading-snug tracking-tight text-[#1c2b33]">{title}</Heading> : null}
              {subtitle ? <p className="mt-1 text-sm text-[#4a5d66]">{subtitle}</p> : null}
              {children}
            </div>
            {action ? <div className="shrink-0">{action}</div> : null}
          </div>
        );
      }

      function CardBody({ padding = "lg", className, children, ...rest }) {
        return (
          <div
            className={cx("text-sm leading-relaxed text-[#4a5d66]", padding === "lg" ? "px-6 pb-5 pt-0" : PADDING[padding], className)}
            {...rest}
          >
            {children}
          </div>
        );
      }

      function CardFooter({ divided = true, padding = "lg", className, children, ...rest }) {
        return (
          <div
            className={cx("mt-auto flex flex-wrap items-center gap-3", divided && "border-t border-[#ece0cd]", PADDING[padding], className)}
            {...rest}
          >
            {children}
          </div>
        );
      }

      /* ---- demo helpers ---- */
      function Badge({ children }) {
        return (
          <span className="inline-flex items-center rounded-full bg-[#0f5c5c]/90 px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wide text-[#fbf7f0] shadow-sm backdrop-blur-sm">
            {children}
          </span>
        );
      }
      function Btn({ children, primary }) {
        return (
          <button
            type="button"
            className={cx(
              "inline-flex h-9 items-center rounded-lg px-3.5 text-sm font-medium outline-none transition-colors",
              "focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#fdfbf7] focus-visible:ring-[#1f8a8a]",
              primary
                ? "bg-[#1f8a8a] text-[#fbf7f0] hover:bg-[#0f5c5c]"
                : "bg-transparent text-[#0f5c5c] ring-1 ring-inset ring-[#1f8a8a]/30 hover:bg-[#2ec3c3]/10"
            )}
          >
            {children}
          </button>
        );
      }
      function MenuBtn() {
        return (
          <button
            type="button"
            aria-label="Open card menu"
            className="inline-flex h-8 w-8 items-center justify-center rounded-full text-[#4a5d66] outline-none transition-colors hover:bg-[#1c2b33]/[0.06] focus-visible:ring-2 focus-visible:ring-[#1f8a8a]"
          >
            <svg className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <circle cx="10" cy="4" r="1.6" /><circle cx="10" cy="10" r="1.6" /><circle cx="10" cy="16" r="1.6" />
            </svg>
          </button>
        );
      }

      /* inline SVG data-URI "photos" so the preview is fully self-contained */
      const wave = (a, b) =>
        "data:image/svg+xml;utf8," +
        encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' width='640' height='360'>
             <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
               <stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/>
             </linearGradient></defs>
             <rect width='640' height='360' fill='url(#g)'/>
             <path d='M0 250 Q160 200 320 250 T640 250 V360 H0 Z' fill='#ffffff' opacity='0.18'/>
             <path d='M0 285 Q160 240 320 285 T640 285 V360 H0 Z' fill='#ffffff' opacity='0.22'/>
             <circle cx='520' cy='90' r='46' fill='#fbf7f0' opacity='0.55'/>
           </svg>`
        );

      function Section({ title, hint, children, cols = "sm:grid-cols-2 lg:grid-cols-3" }) {
        return (
          <section className="mb-12">
            <div className="mb-4 flex items-baseline justify-between gap-4">
              <h2 className="text-xs font-semibold uppercase tracking-[0.18em] text-[#4a5d66]">{title}</h2>
              {hint ? <span className="text-xs text-[#4a5d66]/80">{hint}</span> : null}
            </div>
            <div className={cx("grid grid-cols-1 gap-5", cols)}>{children}</div>
          </section>
        );
      }

      function Demo() {
        return (
          <main className="mx-auto max-w-5xl px-6 py-16">
            <header className="mb-12">
              <span className="text-xs font-semibold uppercase tracking-[0.2em] text-[#1f8a8a]">saltycodestudio</span>
              <h1 className="mt-2 text-3xl font-semibold tracking-tight text-[#1c2b33]">Card</h1>
              <p className="mt-2 max-w-prose text-sm text-[#4a5d66]">
                A composable surface — media, header, body, footer — with three variants and an
                accessible hover-lift link mode, all on the Sand &amp; Surf palette. Hover any card,
                or press Tab to reach the link card and watch the focus ring.
              </p>
            </header>

            {/* Surface variants */}
            <Section title="Surface variants" hint="solid · soft · outline">
              {["solid", "soft", "outline"].map((v) => (
                <Card key={v} variant={v}>
                  <CardHeader eyebrow={v} title={`The ${v} surface`} subtitle="Same anatomy, different skin." />
                  <CardBody>
                    Cards share one structure — swap <code className="rounded bg-[#1c2b33]/[0.06] px-1 py-0.5 text-[#0f5c5c]">variant</code> to
                    re-skin without touching content.
                  </CardBody>
                  <CardFooter>
                    <Btn primary>Action</Btn>
                    <Btn>Cancel</Btn>
                  </CardFooter>
                </Card>
              ))}
            </Section>

            {/* Media + hover lift */}
            <Section title="Media card · hover lift + zoom" hint="hover to see the lift">
              <Card hoverLift>
                <CardMedia src={wave("#2ec3c3", "#0f5c5c")} alt="Abstract turquoise wave gradient" overlay={<Badge>New</Badge>} />
                <CardHeader eyebrow="Field notes" title="Designing for the shoreline" subtitle="Sand &amp; Surf in bright sun" />
                <CardBody>The hover lift deepens the shadow and gently zooms the image — disabled under reduced motion.</CardBody>
                <CardFooter>
                  <span className="text-xs text-[#4a5d66]">5 min read</span>
                  <span className="ml-auto"><Btn primary>Read</Btn></span>
                </CardFooter>
              </Card>

              <Card hoverLift variant="soft">
                <CardMedia ratio="4/3" src={wave("#1f8a8a", "#1c2b33")} alt="Deep teal to ink gradient" overlay={<Badge>4 / 3</Badge>} />
                <CardHeader title="Tide tables, v2" subtitle="Now with offline sync" action={<MenuBtn />} />
                <CardBody>A different aspect ratio and an action slot in the header — still one composable card.</CardBody>
              </Card>

              <Card hoverLift>
                <CardMedia ratio="1/1" src={wave("#f4ece0", "#2ec3c3")} alt="Sand to surf square gradient" />
                <CardHeader title="Square format" subtitle="1 / 1 media frame" />
                <CardBody>Use square media for galleries and product grids.</CardBody>
                <CardFooter divided={false}>
                  <span className="text-sm font-semibold text-[#0f5c5c]">$48</span>
                  <span className="ml-auto"><Btn>Add to bag</Btn></span>
                </CardFooter>
              </Card>
            </Section>

            {/* Horizontal layout */}
            <Section title="Horizontal layout" hint="media-left, full-bleed" cols="lg:grid-cols-2">
              <Card hoverLift className="sm:flex-row">
                <div className="sm:w-2/5">
                  <CardMedia ratio="4/3" src={wave("#2ec3c3", "#1f8a8a")} alt="Turquoise gradient" />
                </div>
                <div className="flex min-w-0 flex-1 flex-col">
                  <CardHeader eyebrow="Guide" title="Bonaire, end to end" subtitle="Reefs, salt flats, and slow mornings" />
                  <CardBody>Slots stack in a column inside a row — the footer still pins to the bottom.</CardBody>
                  <CardFooter><Btn primary>Open guide</Btn></CardFooter>
                </div>
              </Card>

              <Card variant="outline" className="sm:flex-row">
                <div className="sm:w-2/5">
                  <CardMedia ratio="4/3" src={wave("#1c2b33", "#0f5c5c")} alt="Ink to deep teal gradient" />
                </div>
                <div className="flex min-w-0 flex-1 flex-col">
                  <CardHeader title="Outline + horizontal" subtitle="No hover lift here" />
                  <CardBody>Outline surface keeps it quiet — good for secondary content.</CardBody>
                </div>
              </Card>
            </Section>

            {/* No-media / stat cards */}
            <Section title="No media · stat &amp; content cards" hint="header + body only">
              <Card variant="soft">
                <CardBody padding="lg" className="text-[#1c2b33]">
                  <p className="text-xs font-semibold uppercase tracking-[0.14em] text-[#1f8a8a]">Monthly visitors</p>
                  <p className="mt-2 text-4xl font-semibold tracking-tight text-[#1c2b33]">128,540</p>
                  <p className="mt-1 text-sm text-[#4a5d66]"><span className="font-medium text-[#0f5c5c]">+12.4%</span> vs. last month</p>
                </CardBody>
              </Card>

              <Card>
                <CardHeader as="h3" eyebrow="Plan" title="Surf · Pro" action={<Badge>Popular</Badge>} />
                <CardBody>
                  <p className="text-3xl font-semibold tracking-tight text-[#1c2b33]">$19<span className="text-base font-normal text-[#4a5d66]">/mo</span></p>
                  <ul className="mt-4 space-y-2">
                    {["Unlimited cards", "Hover lift + link mode", "Priority support"].map((f) => (
                      <li key={f} className="flex items-center gap-2 text-[#4a5d66]">
                        <svg className="h-4 w-4 shrink-0 text-[#1f8a8a]" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" /></svg>
                        {f}
                      </li>
                    ))}
                  </ul>
                </CardBody>
                <CardFooter><Btn primary>Choose plan</Btn></CardFooter>
              </Card>

              <Card variant="outline">
                <CardHeader title="Compact" subtitle="padding=&quot;sm&quot; throughout" padding="sm" />
                <CardBody padding="sm">Tighter spacing for dense dashboards and lists.</CardBody>
                <CardFooter padding="sm"><Btn>Details</Btn></CardFooter>
              </Card>
            </Section>

            {/* Link card */}
            <Section title="Whole-card link" hint="Tab here → one focus ring" cols="lg:grid-cols-2">
              <Card hoverLift href="#read-more" aria-label="Read: The salt flats at dawn">
                <CardMedia src={wave("#2ec3c3", "#0f5c5c")} alt="Turquoise to deep teal gradient" overlay={<Badge>Link</Badge>} />
                <CardHeader eyebrow="Story" title="The salt flats at dawn" subtitle="The entire card is one anchor" />
                <CardBody>With <code className="rounded bg-[#1c2b33]/[0.06] px-1 py-0.5 text-[#0f5c5c]">href</code> set, the root renders as
                  an <code className="rounded bg-[#1c2b33]/[0.06] px-1 py-0.5 text-[#0f5c5c]">&lt;a&gt;</code> — one Tab stop, visible focus ring,
                  no nested controls.</CardBody>
                <CardFooter>
                  <span className="text-xs font-medium text-[#0f5c5c]">Read story →</span>
                </CardFooter>
              </Card>

              <Card hoverLift href="https://example.com" external aria-label="Open external docs (new tab)">
                <CardHeader eyebrow="External" title="Opens in a new tab" subtitle="external adds safe rel" action={
                  <svg className="h-4 w-4 text-[#4a5d66]" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M8 4H5a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1v-3M12 4h4v4M16 4l-7 7" /></svg>
                } />
                <CardBody>Sets <code className="rounded bg-[#1c2b33]/[0.06] px-1 py-0.5 text-[#0f5c5c]">target=&quot;_blank&quot;</code> and
                  <code className="rounded bg-[#1c2b33]/[0.06] px-1 py-0.5 text-[#0f5c5c]">rel=&quot;noopener noreferrer&quot;</code> automatically.</CardBody>
              </Card>
            </Section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
