<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segmented Control — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    </style>
  </head>
  <body class="bg-[#fbf7f0]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useRef, useCallback, useLayoutEffect, useEffect } = React;

      /* ---- style maps (mirrors SegmentedControl.tsx) ---- */
      const SIZE = {
        sm: { track: "h-8 p-0.5 text-xs",  segment: "px-2.5 gap-1.5", gap: "rounded-md",  icon: "h-3.5 w-3.5" },
        md: { track: "h-10 p-1 text-sm",   segment: "px-3.5 gap-2",   gap: "rounded-lg",  icon: "h-4 w-4" },
        lg: { track: "h-12 p-1 text-base", segment: "px-5 gap-2",     gap: "rounded-xl",  icon: "h-5 w-5" },
      };
      const cx = (...p) => p.filter(Boolean).join(" ");

      function SegmentedControl({
        options, value, onChange, size = "md", fullWidth = false, disabled = false,
        className, "aria-label": ariaLabel, "aria-labelledby": ariaLabelledby,
      }) {
        const sizing = SIZE[size];
        const trackRef = useRef(null);
        const itemRefs = useRef([]);
        const selectedIndex = Math.max(0, options.findIndex((o) => o.value === value));
        const [pill, setPill] = useState(null);

        const measure = useCallback(() => {
          const track = trackRef.current;
          const el = itemRefs.current[selectedIndex];
          if (!track || !el) return;
          setPill({ left: el.offsetLeft, width: el.offsetWidth });
        }, [selectedIndex]);

        useLayoutEffect(() => { measure(); }, [measure, options, size, fullWidth]);

        useEffect(() => {
          if (typeof ResizeObserver === "undefined") {
            window.addEventListener("resize", measure);
            return () => window.removeEventListener("resize", measure);
          }
          const ro = new ResizeObserver(measure);
          if (trackRef.current) ro.observe(trackRef.current);
          return () => ro.disconnect();
        }, [measure]);

        const moveTo = (start, dir) => {
          const n = options.length;
          for (let step = 1; step <= n; step++) {
            const i = (start + dir * step + n * step) % n;
            if (!options[i]?.disabled) {
              onChange(options[i].value);
              itemRefs.current[i]?.focus();
              return;
            }
          }
        };
        const edge = (which) => {
          const order = which === "first"
            ? options.map((_, i) => i)
            : options.map((_, i) => i).reverse();
          for (const i of order) {
            if (!options[i]?.disabled) {
              onChange(options[i].value);
              itemRefs.current[i]?.focus();
              return;
            }
          }
        };
        const onKeyDown = (e, index) => {
          switch (e.key) {
            case "ArrowRight": case "ArrowDown": e.preventDefault(); moveTo(index, 1); break;
            case "ArrowLeft":  case "ArrowUp":   e.preventDefault(); moveTo(index, -1); break;
            case "Home": e.preventDefault(); edge("first"); break;
            case "End":  e.preventDefault(); edge("last"); break;
            default: break;
          }
        };

        return (
          <div
            ref={trackRef}
            role="radiogroup"
            aria-label={ariaLabel}
            aria-labelledby={ariaLabelledby}
            aria-disabled={disabled || undefined}
            className={cx(
              "relative inline-flex items-center isolate",
              "rounded-[14px] bg-[#ece0cd] ring-1 ring-inset ring-[#1c2b33]/10",
              "shadow-[inset_0_1px_2px_rgba(28,43,51,0.08)]",
              fullWidth && "flex w-full",
              disabled && "opacity-55",
              sizing.track, className
            )}
          >
            {pill ? (
              <span
                aria-hidden="true"
                className={cx(
                  "pointer-events-none absolute top-1/2 z-0 -translate-y-1/2",
                  "bg-[#fdfbf7] ring-1 ring-inset ring-[#1c2b33]/10",
                  "shadow-[0_1px_2px_rgba(28,43,51,0.12),0_2px_8px_rgba(28,43,51,0.08)]",
                  "motion-safe:transition-[transform,width] motion-safe:duration-300 motion-safe:ease-[cubic-bezier(0.34,1.56,0.64,1)]",
                  sizing.gap
                )}
                style={{
                  height: "calc(100% - 0.5rem)",
                  width: `${pill.width}px`,
                  transform: `translate(${pill.left}px, -50%)`,
                }}
              />
            ) : null}

            {options.map((opt, i) => {
              const active = i === selectedIndex;
              const isDisabled = disabled || opt.disabled;
              return (
                <button
                  key={opt.value}
                  ref={(node) => { itemRefs.current[i] = node; }}
                  type="button"
                  role="radio"
                  aria-checked={active}
                  disabled={isDisabled}
                  tabIndex={active && !isDisabled ? 0 : -1}
                  onClick={() => !isDisabled && onChange(opt.value)}
                  onKeyDown={(e) => !isDisabled && onKeyDown(e, i)}
                  className={cx(
                    "relative z-10 inline-flex h-full items-center justify-center whitespace-nowrap",
                    "font-medium leading-none transition-colors duration-150",
                    "outline-none focus-visible:ring-2 focus-visible:ring-[#1f8a8a] focus-visible:ring-offset-1 focus-visible:ring-offset-[#ece0cd]",
                    "disabled:cursor-not-allowed disabled:opacity-45",
                    fullWidth && "flex-1",
                    active ? "text-[#0f5c5c]" : "text-[#4a5d66] hover:text-[#1c2b33]",
                    sizing.gap, sizing.segment
                  )}
                >
                  {opt.icon ? <span aria-hidden="true" className={cx("shrink-0", sizing.icon)}>{opt.icon}</span> : null}
                  <span className="truncate">{opt.label}</span>
                </button>
              );
            })}
          </div>
        );
      }

      /* ---- demo-only inline icons ---- */
      const Stroke = ({ d, children }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
             strokeLinecap="round" strokeLinejoin="round" className="h-full w-full">
          {d ? <path d={d} /> : children}
        </svg>
      );
      const IconList = () => <Stroke><line x1="8" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></Stroke>;
      const IconGrid = () => <Stroke><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></Stroke>;
      const IconMap  = () => <Stroke><path d="M9 4 4 6v14l5-2 6 2 5-2V4l-5 2-6-2Z"/><path d="M9 4v14M15 6v14"/></Stroke>;

      function Section({ title, children, note }) {
        return (
          <div className="border-b border-[#ece0cd] py-6 last:border-0">
            <h3 className="mb-3 text-xs font-semibold uppercase tracking-wider text-[#4a5d66]">{title}</h3>
            {children}
            {note ? <p className="mt-3 text-xs text-[#4a5d66]">{note}</p> : null}
          </div>
        );
      }

      function Demo() {
        const [view, setView]   = useState("list");
        const [period, setPeriod] = useState("monthly");
        const [tab, setTab]     = useState("overview");
        const [seg, setSeg]     = useState("write");
        const [size, setSize]   = useState("md");

        const viewOptions = [
          { value: "list", label: "List", icon: <IconList /> },
          { value: "grid", label: "Grid", icon: <IconGrid /> },
          { value: "map",  label: "Map",  icon: <IconMap /> },
        ];
        const periodOptions = [
          { value: "monthly", label: "Monthly" },
          { value: "annual",  label: "Annual" },
        ];
        const tabOptions = [
          { value: "overview", label: "Overview" },
          { value: "activity", label: "Activity" },
          { value: "reports",  label: "Reports", disabled: true },
          { value: "settings", label: "Settings" },
        ];

        const viewCopy = {
          list: "Compact rows, one item per line — best for scanning.",
          grid: "Card thumbnails in a responsive grid — best for visuals.",
          map:  "Pin overlay on an interactive map — best for places.",
        };

        return (
          <main className="mx-auto max-w-3xl px-6 py-16">
            <header className="mb-8">
              <span className="text-xs font-semibold uppercase tracking-[0.2em] text-[#1f8a8a]">saltycodestudio</span>
              <h1 className="mt-2 text-3xl font-semibold tracking-tight text-[#1c2b33]">Segmented Control</h1>
              <p className="mt-2 max-w-prose text-sm text-[#4a5d66]">
                iOS-style tab switcher with an animated sliding pill. Built as a WAI-ARIA radiogroup
                with arrow-key / Home / End navigation and a roving tab stop — on the Sand &amp; Surf palette.
              </p>
            </header>

            <section className="rounded-2xl border border-[#ece0cd] bg-[#fdfbf7] px-6 ring-1 ring-inset ring-white/60">
              <Section title="With icons + live content" note="Use ← → (or Tab in, then arrows) to move the pill.">
                <SegmentedControl
                  options={viewOptions}
                  value={view}
                  onChange={setView}
                  aria-label="View mode"
                />
                <div className="mt-4 rounded-xl bg-[#f4ece0] px-4 py-3 text-sm text-[#1c2b33] ring-1 ring-inset ring-[#1c2b33]/5">
                  <span className="font-medium capitalize">{view}</span> — {viewCopy[view]}
                </div>
              </Section>

              <Section title="Sizes (sm · md · lg)">
                <div className="flex flex-col items-start gap-3">
                  <SegmentedControl size="sm" options={periodOptions} value={period} onChange={setPeriod} aria-label="Billing period, small" />
                  <SegmentedControl size="md" options={periodOptions} value={period} onChange={setPeriod} aria-label="Billing period, medium" />
                  <SegmentedControl size="lg" options={periodOptions} value={period} onChange={setPeriod} aria-label="Billing period, large" />
                </div>
              </Section>

              <Section title="Full width" note="Each segment flexes to share the row equally.">
                <SegmentedControl
                  fullWidth
                  options={[
                    { value: "write",   label: "Write" },
                    { value: "preview", label: "Preview" },
                    { value: "diff",    label: "Diff" },
                  ]}
                  value={seg}
                  onChange={setSeg}
                  aria-label="Editor pane"
                />
              </Section>

              <Section title="Disabled segment (Reports)" note="Arrow keys skip disabled segments automatically.">
                <SegmentedControl
                  options={tabOptions}
                  value={tab}
                  onChange={setTab}
                  aria-label="Dashboard section"
                />
              </Section>

              <Section title="Entire control disabled">
                <SegmentedControl
                  disabled
                  options={periodOptions}
                  value={period}
                  onChange={setPeriod}
                  aria-label="Billing period, disabled"
                />
              </Section>

              <Section title="Drives a real control (size picker)">
                <SegmentedControl
                  options={[
                    { value: "sm", label: "Small" },
                    { value: "md", label: "Medium" },
                    { value: "lg", label: "Large" },
                  ]}
                  value={size}
                  onChange={setSize}
                  aria-label="Demo size"
                />
                <div className="mt-4">
                  <SegmentedControl
                    size={size}
                    options={viewOptions}
                    value={view}
                    onChange={setView}
                    aria-label="View mode, resized"
                  />
                </div>
              </Section>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
