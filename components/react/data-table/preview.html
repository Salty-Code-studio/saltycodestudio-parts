<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Table — saltycodestudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
    </style>
  </head>
  <body class="bg-[#fbf7f0]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useState, useMemo, useCallback } = React;

      /* ---------- defaultCompare ---------- */
      function defaultCompare(a, b) {
        const an = a == null, bn = b == null;
        if (an && bn) return 0;
        if (an) return 1;
        if (bn) return -1;
        if (typeof a === "number" && typeof b === "number") return a - b;
        if (a instanceof Date && b instanceof Date) return a.getTime() - b.getTime();
        return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
      }

      function SortIcon({ state }) {
        return (
          <span className="ml-1.5 inline-flex flex-col text-[0.55rem] leading-[0.55rem]" aria-hidden="true">
            <span className={state === "asc" ? "text-[#1f8a8a]" : "text-[#c3b6a0]"}>▲</span>
            <span className={state === "desc" ? "text-[#1f8a8a]" : "text-[#c3b6a0]"}>▼</span>
          </span>
        );
      }

      function DefaultEmptyState() {
        return (
          <div className="flex flex-col items-center justify-center gap-3 px-6 py-16 text-center">
            <div className="grid h-12 w-12 place-items-center rounded-full bg-[#eaf6f5] text-[#1f8a8a]">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" className="h-6 w-6" aria-hidden="true">
                <path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z" />
                <path d="M3 12l9 4.5 9-4.5" />
                <path d="M3 16.5 12 21l9-4.5" />
              </svg>
            </div>
            <p className="text-sm font-semibold text-[#1c2b33]">No data to show</p>
            <p className="max-w-xs text-sm text-[#4a5d66]">
              There&apos;s nothing here yet. New records will appear in this table once they exist.
            </p>
          </div>
        );
      }

      /* ---------- DataTable ---------- */
      function DataTable({
        columns, data, rowKey, caption, title, description,
        sort, onSortChange, defaultSort,
        stickyHeader = true, zebra = true, maxHeight,
        loading = false, loadingRows = 5, emptyState, onRowClick, className = "",
      }) {
        const isControlled = sort !== undefined;
        const [internalSort, setInternalSort] = useState(defaultSort ?? { key: null, direction: "asc" });
        const activeSort = isControlled ? sort : internalSort;

        const handleSort = useCallback((key) => {
          const next = activeSort.key === key
            ? { key, direction: activeSort.direction === "asc" ? "desc" : "asc" }
            : { key, direction: "asc" };
          if (!isControlled) setInternalSort(next);
          onSortChange && onSortChange(next);
        }, [activeSort, isControlled, onSortChange]);

        const sortedData = useMemo(() => {
          if (!activeSort.key) return data;
          const col = columns.find((c) => c.key === activeSort.key);
          if (!col) return data;
          const cmp = col.sortFn ?? ((a, b) => defaultCompare(a, b));
          const dir = activeSort.direction === "asc" ? 1 : -1;
          return data
            .map((row, index) => ({ row, index }))
            .sort((x, y) => {
              const r = cmp(x.row[activeSort.key], y.row[activeSort.key]);
              return r !== 0 ? r * dir : x.index - y.index;
            })
            .map((d) => d.row);
        }, [data, columns, activeSort]);

        const alignClass = (a) => a === "right" ? "text-right" : a === "center" ? "text-center" : "text-left";
        const colCount = columns.length;
        const showEmpty = !loading && sortedData.length === 0;

        return (
          <div className={`overflow-hidden rounded-2xl border border-[#e7ddcd] bg-[#fbf7f0] shadow-sm ${className}`}>
            {(title || description) && (
              <div className="flex flex-wrap items-baseline justify-between gap-2 border-b border-[#e7ddcd] bg-[#f4ece0] px-5 py-4">
                <div>
                  {title && <h2 className="text-base font-semibold tracking-tight text-[#1c2b33]">{title}</h2>}
                  {description && <p className="mt-0.5 text-sm text-[#4a5d66]">{description}</p>}
                </div>
                {!loading && (
                  <span className="rounded-full bg-[#ece0cd] px-2.5 py-0.5 text-xs font-medium text-[#4a5d66]">
                    {sortedData.length} {sortedData.length === 1 ? "row" : "rows"}
                  </span>
                )}
              </div>
            )}

            <div className="relative overflow-auto" style={maxHeight ? { maxHeight } : undefined}>
              <table className="w-full border-collapse text-sm">
                {caption && <caption className="sr-only">{caption}</caption>}
                <thead className={stickyHeader ? "sticky top-0 z-10" : undefined}>
                  <tr className="bg-[#ece0cd]">
                    {columns.map((col) => {
                      const sortable = col.sortable !== false;
                      const isActive = activeSort.key === col.key;
                      const ariaSort = !sortable ? undefined
                        : isActive ? (activeSort.direction === "asc" ? "ascending" : "descending") : "none";
                      return (
                        <th
                          key={col.key}
                          scope="col"
                          aria-sort={ariaSort}
                          style={col.width ? { width: col.width } : undefined}
                          className={`whitespace-nowrap border-b border-[#dccbb0] px-4 py-3 font-semibold text-[#1c2b33] ${alignClass(col.align)}`}
                        >
                          {sortable ? (
                            <button
                              type="button"
                              onClick={() => handleSort(col.key)}
                              className={`group -mx-1 inline-flex items-center rounded px-1 py-0.5 font-semibold transition-colors hover:text-[#0f5c5c] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1f8a8a] focus-visible:ring-offset-1 focus-visible:ring-offset-[#ece0cd] ${col.align === "right" ? "flex-row-reverse" : ""} ${isActive ? "text-[#0f5c5c]" : "text-[#1c2b33]"}`}
                            >
                              <span>{col.header}</span>
                              <SortIcon state={isActive ? activeSort.direction : "none"} />
                            </button>
                          ) : (
                            <span>{col.header}</span>
                          )}
                        </th>
                      );
                    })}
                  </tr>
                </thead>

                <tbody>
                  {loading && Array.from({ length: loadingRows }).map((_, r) => (
                    <tr key={`sk-${r}`} className="border-b border-[#efe6d6]">
                      {columns.map((col) => (
                        <td key={col.key} className="px-4 py-3.5">
                          <div className="h-3.5 animate-pulse rounded bg-[#e7ddcd]" style={{ width: `${50 + ((r * 7 + col.key.length * 11) % 45)}%` }} />
                        </td>
                      ))}
                    </tr>
                  ))}

                  {!loading && sortedData.map((row, rowIndex) => {
                    const key = rowKey ? rowKey(row, rowIndex) : rowIndex;
                    const interactive = Boolean(onRowClick);
                    return (
                      <tr
                        key={key}
                        onClick={interactive ? () => onRowClick(row, rowIndex) : undefined}
                        onKeyDown={interactive ? (e) => {
                          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onRowClick(row, rowIndex); }
                        } : undefined}
                        tabIndex={interactive ? 0 : undefined}
                        role={interactive ? "button" : undefined}
                        className={[
                          "border-b border-[#efe6d6] transition-colors",
                          zebra && rowIndex % 2 === 1 ? "bg-[#f7f1e6]" : "bg-transparent",
                          "hover:bg-[#eaf6f5]",
                          interactive ? "cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#1f8a8a]" : "",
                        ].filter(Boolean).join(" ")}
                      >
                        {columns.map((col) => (
                          <td key={col.key} className={`px-4 py-3 text-[#1c2b33] ${alignClass(col.align)}`}>
                            {col.render ? col.render(row, rowIndex) : (row[col.key] == null ? "—" : row[col.key])}
                          </td>
                        ))}
                      </tr>
                    );
                  })}

                  {showEmpty && (
                    <tr>
                      <td colSpan={colCount} className="p-0">
                        {emptyState ?? <DefaultEmptyState />}
                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      /* ---------- Demo data + helpers ---------- */
      const StatusPill = ({ value }) => {
        const map = {
          Active:   "bg-[#dff1ef] text-[#0f5c5c]",
          Trialing: "bg-[#ece0cd] text-[#4a5d66]",
          Past_due: "bg-[#f7e3d6] text-[#8a4a1f]",
          Churned:  "bg-[#eee6dc] text-[#7a7065]",
        };
        const label = value.replace("_", " ");
        return (
          <span className={`inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium ${map[value] || map.Churned}`}>
            {label}
          </span>
        );
      };

      const ROWS = [
        { name: "Marisol Pérez",   plan: "Studio",     seats: 12, mrr: 480, status: "Active",   joined: "2024-11-02" },
        { name: "Theo Andersen",   plan: "Solo",       seats: 1,  mrr: 29,  status: "Trialing", joined: "2025-03-19" },
        { name: "Aïsha Bakker",    plan: "Agency",     seats: 40, mrr: 1600, status: "Active",   joined: "2023-08-14" },
        { name: "Quincy Roberts",  plan: "Solo",       seats: 2,  mrr: 29,  status: "Past_due", joined: "2025-01-07" },
        { name: "Lia van Dijk",    plan: "Studio",     seats: 9,  mrr: 360, status: "Churned",  joined: "2022-05-30" },
        { name: "Diego Santos",    plan: "Agency",     seats: 28, mrr: 1120, status: "Active",   joined: "2024-02-21" },
        { name: "Noa Williams",    plan: "Solo",       seats: 1,  mrr: 29,  status: "Active",   joined: "2025-04-11" },
        { name: "Hassan El Amin",  plan: "Studio",     seats: 7,  mrr: 280, status: "Trialing", joined: "2025-05-02" },
      ];

      const COLUMNS = [
        { key: "name",   header: "Customer" },
        { key: "plan",   header: "Plan" },
        { key: "seats",  header: "Seats",  align: "right", width: "6rem" },
        { key: "mrr",    header: "MRR",    align: "right", width: "7rem", render: (r) => <span className="tabular-nums font-medium">${r.mrr.toLocaleString()}</span> },
        { key: "status", header: "Status", sortable: true, render: (r) => <StatusPill value={r.status} /> },
        { key: "joined", header: "Joined", align: "right", width: "8rem",
          render: (r) => <span className="tabular-nums text-[#4a5d66]">{r.joined}</span>,
          sortFn: (a, b) => new Date(a).getTime() - new Date(b).getTime() },
      ];

      function Section({ title, children }) {
        return (
          <section className="mb-12">
            <h3 className="mb-3 text-xs font-semibold uppercase tracking-[0.14em] text-[#4a5d66]">{title}</h3>
            {children}
          </section>
        );
      }

      function Demo() {
        const [selected, setSelected] = useState(null);
        return (
          <main className="mx-auto max-w-5xl px-6 py-14">
            <header className="mb-10">
              <p className="text-xs font-semibold uppercase tracking-[0.2em] text-[#1f8a8a]">saltycodestudio · parts</p>
              <h1 className="mt-2 text-3xl font-semibold tracking-tight text-[#1c2b33] sm:text-4xl">Data Table</h1>
              <p className="mt-2 max-w-2xl text-[#4a5d66]">
                Sortable columns, zebra + hover rows, a sticky header, loading skeletons, and an empty state — in the Sand &amp; Surf palette.
              </p>
            </header>

            <Section title="Full table · sortable · sticky header · clickable rows">
              <DataTable
                columns={COLUMNS}
                data={ROWS}
                rowKey={(r) => r.name}
                title="Customers"
                description="Click any header to sort. Rows are keyboard-focusable."
                caption="Customer accounts with plan, seats, MRR, status and join date"
                defaultSort={{ key: "mrr", direction: "desc" }}
                maxHeight="20rem"
                onRowClick={(r) => setSelected(r.name)}
              />
              <p className="mt-3 text-sm text-[#4a5d66]" aria-live="polite">
                {selected ? <>Selected row: <strong className="text-[#0f5c5c]">{selected}</strong></> : "Click a row to select it."}
              </p>
            </Section>

            <Section title="No striping · no sticky header (zebra={false})">
              <DataTable
                columns={COLUMNS.slice(0, 4)}
                data={ROWS.slice(0, 4)}
                zebra={false}
                stickyHeader={false}
                caption="Compact non-striped variant"
              />
            </Section>

            <Section title="Loading state">
              <DataTable columns={COLUMNS} data={[]} loading title="Customers" description="Fetching the latest records…" />
            </Section>

            <Section title="Empty state">
              <DataTable columns={COLUMNS} data={[]} title="Customers" description="No results for the current filters." />
            </Section>

            <Section title="Empty state · custom content">
              <DataTable
                columns={COLUMNS}
                data={[]}
                title="Invoices"
                emptyState={
                  <div className="flex flex-col items-center gap-3 px-6 py-14 text-center">
                    <p className="text-sm font-semibold text-[#1c2b33]">No invoices yet</p>
                    <p className="max-w-sm text-sm text-[#4a5d66]">When you send your first invoice it will show up right here.</p>
                    <button type="button" className="rounded-lg bg-[#1f8a8a] px-3.5 py-1.5 text-sm font-semibold text-white transition-colors hover:bg-[#0f5c5c] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1f8a8a] focus-visible:ring-offset-2 focus-visible:ring-offset-[#fbf7f0]">
                      Create invoice
                    </button>
                  </div>
                }
              />
            </Section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
