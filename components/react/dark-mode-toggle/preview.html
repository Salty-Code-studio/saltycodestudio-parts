<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode Toggle — saltycodestudio</title>
    <script>
      // Enable Tailwind class-based dark mode for the Play CDN.
      window.tailwind = window.tailwind || {};
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "class" };</script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style> body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; } </style>
  </head>
  <body class="bg-[#faf6ef] transition-colors duration-500 dark:bg-[#08161c]">
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useEffect, useState } = React;

      function getInitialDark(storageKey) {
        if (typeof window === "undefined") return false;
        const stored = localStorage.getItem(storageKey);
        if (stored === "dark") return true;
        if (stored === "light") return false;
        return window.matchMedia("(prefers-color-scheme: dark)").matches;
      }

      function DarkModeToggle({ storageKey = "scs-theme", applyToDocument = true, onChange, className = "" }) {
        const [dark, setDark] = useState(false);
        const [mounted, setMounted] = useState(false);
        useEffect(() => { setDark(getInitialDark(storageKey)); setMounted(true); }, [storageKey]);
        useEffect(() => {
          if (!mounted) return;
          const theme = dark ? "dark" : "light";
          if (applyToDocument) document.documentElement.classList.toggle("dark", dark);
          localStorage.setItem(storageKey, theme);
          onChange && onChange(theme);
        }, [dark, mounted, applyToDocument, storageKey, onChange]);
        return (
          <button type="button" role="switch" aria-checked={dark} aria-label="Toggle dark mode" onClick={() => setDark((d) => !d)} className={`group relative grid h-11 w-11 place-items-center overflow-hidden rounded-full border border-[#e7ddcd] bg-[#faf6ef] text-[#1c2b33] transition-colors duration-300 hover:border-teal-700/40 dark:border-white/15 dark:bg-[#0f1c22] dark:text-amber-200 ${className}`}>
            <span className="relative h-5 w-5">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" className={`absolute inset-0 h-5 w-5 transition-all duration-500 ${dark ? "rotate-90 scale-0 opacity-0" : "rotate-0 scale-100 opacity-100"}`} aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
              </svg>
              <svg viewBox="0 0 24 24" fill="currentColor" className={`absolute inset-0 h-5 w-5 transition-all duration-500 ${dark ? "rotate-0 scale-100 opacity-100" : "-rotate-90 scale-0 opacity-0"}`} aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
              </svg>
            </span>
          </button>
        );
      }

      function Demo() {
        return (
          <div className="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center gap-6 px-6 text-center">
            <DarkModeToggle />
            <h1 className="text-3xl font-semibold tracking-tight text-[#1c2b33] dark:text-white">Dark Mode Toggle</h1>
            <p className="text-[#5b6b72] dark:text-white/60">Click the switch. The sun morphs into a moon, the page theme flips, and the choice is saved to localStorage for next visit.</p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    </script>
  </body>
</html>
