<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Tilt Card — saltycodestudio</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fdf6ec,#e9c46a 130%);font-family:system-ui,sans-serif}

  /* ---- component ---- */
  .scs-tilt{perspective:1000px;display:inline-block}
  .scs-tilt__card{position:relative;width:300px;min-height:380px;border-radius:20px;padding:1.75rem;background:linear-gradient(160deg,#134e5e,#0d2a3a);color:#eaf6f8;transform-style:preserve-3d;transform:rotateX(0) rotateY(0) translateZ(0);box-shadow:0 10px 30px rgba(5,17,26,.45);transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s ease;overflow:hidden}
  .scs-tilt:hover .scs-tilt__card{transform:rotateX(8deg) rotateY(-12deg) translateZ(24px) scale(1.02);box-shadow:28px 34px 60px rgba(5,17,26,.55)}
  .scs-tilt__card::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
  .scs-tilt:hover .scs-tilt__card::before{transform:translateX(120%)}
  .scs-tilt__layer{position:relative;transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .scs-tilt__eyebrow{transform:translateZ(20px)}.scs-tilt__title{transform:translateZ(40px)}.scs-tilt__body{transform:translateZ(28px)}.scs-tilt__tag{transform:translateZ(60px)}
  .scs-tilt:hover .scs-tilt__eyebrow{transform:translateZ(40px)}.scs-tilt:hover .scs-tilt__title{transform:translateZ(70px)}.scs-tilt:hover .scs-tilt__body{transform:translateZ(48px)}.scs-tilt:hover .scs-tilt__tag{transform:translateZ(100px)}
  .scs-tilt__eyebrow{margin:0 0 .5rem;font:600 .72rem/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#4ec4a3}
  .scs-tilt__title{margin:0 0 .75rem;font:800 1.7rem/1.1 system-ui;letter-spacing:-.02em}
  .scs-tilt__body{margin:0;font:400 .95rem/1.55 system-ui;color:rgba(234,246,248,.8)}
  .scs-tilt__tag{position:absolute;bottom:1.75rem;left:1.75rem;display:inline-block;padding:.4rem .85rem;border-radius:999px;background:#f4a259;color:#0d2a3a;font:700 .75rem/1 system-ui;letter-spacing:.03em}
  @media (prefers-reduced-motion:reduce){.scs-tilt__card,.scs-tilt__layer,.scs-tilt__card::before{transition:none}.scs-tilt:hover .scs-tilt__card{transform:translateZ(0) scale(1.01)}}
</style>
</head>
<body>
  <div class="scs-tilt">
    <article class="scs-tilt__card">
      <p class="scs-tilt__layer scs-tilt__eyebrow">Sand &amp; Surf</p>
      <h3 class="scs-tilt__layer scs-tilt__title">Depth on Hover</h3>
      <p class="scs-tilt__layer scs-tilt__body">
        The card lifts and tilts in 3D while inner layers float forward at
        different depths for a parallax feel. A sheen sweeps across on entry.
      </p>
      <span class="scs-tilt__layer scs-tilt__tag">Pure CSS</span>
    </article>
  </div>
</body>
</html>
