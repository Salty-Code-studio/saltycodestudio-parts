<!-- .scs-tilt sets the perspective; .scs-tilt__card is what tilts.
     Layers float at different depths via translateZ. -->
<div class="scs-tilt">
  <article class="scs-tilt__card">
    <p class="scs-tilt__layer scs-tilt__eyebrow">Sand &amp; Surf</p>
    <h3 class="scs-tilt__layer scs-tilt__title">Depth on Hover</h3>
    <p class="scs-tilt__layer scs-tilt__body">
      The card lifts and tilts in 3D while inner layers float forward at
      different depths for a parallax feel. A sheen sweeps across on entry.
    </p>
    <span class="scs-tilt__layer scs-tilt__tag">Pure CSS</span>
  </article>
</div>
