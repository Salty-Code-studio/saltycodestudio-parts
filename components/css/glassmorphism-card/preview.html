<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glassmorphism Card — saltycodestudio</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
    background:
      radial-gradient(60% 80% at 20% 20%, #16b8c4 0%, rgba(22,184,196,0) 60%),
      radial-gradient(70% 90% at 85% 75%, #f4a259 0%, rgba(244,162,89,0) 55%),
      linear-gradient(135deg, #0d2a3a, #134e5e);
  }

  /* ---- component ---- */
  .scs-glass-card{
    position:relative;width:100%;max-width:360px;padding:1.75rem;border-radius:20px;
    background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    border:1px solid rgba(255,255,255,.28);
    box-shadow:0 8px 32px rgba(13,42,58,.28), inset 0 1px 0 rgba(255,255,255,.45);
    color:#0d2a3a;overflow:hidden;
  }
  .scs-glass-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(120% 80% at 0% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%);
    pointer-events:none;
  }
  .scs-glass-card__eyebrow{position:relative;margin:0 0 .5rem;font:600 .72rem/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#0e7c86}
  .scs-glass-card__title{position:relative;margin:0 0 .5rem;font:700 1.4rem/1.2 system-ui,sans-serif}
  .scs-glass-card__body{position:relative;margin:0;font:400 .95rem/1.55 system-ui,sans-serif;color:rgba(13,42,58,.78)}
</style>
</head>
<body>
  <article class="scs-glass-card">
    <p class="scs-glass-card__eyebrow">Sand &amp; Surf</p>
    <h3 class="scs-glass-card__title">Frosted Glass</h3>
    <p class="scs-glass-card__body">
      A backdrop-blurred pane with a subtle inner highlight and a crisp light
      border. Place it over a photo or gradient for the best effect.
    </p>
  </article>
</body>
</html>
