<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Window Parallax Carousel</title>
<link rel="stylesheet" href="./styles.css">
<style>
  /* Demo shell only, not part of the component */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f4ece0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wpc-slides { max-width: min(92vw, 960px); }
</style>
</head>
<body>

  <!-- Drag or scroll the strip sideways. Each image pans inside its frame. -->
  <ul class="wpc-slides" tabindex="0" aria-label="Postcard carousel, scrolls sideways">
    <li class="wpc-slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Cdefs%3E%3ClinearGradient id='sky' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fbf7f0'/%3E%3Cstop offset='1' stop-color='%23ece0cd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='900' height='600' fill='url(%23sky)'/%3E%3Ccircle cx='250' cy='226' r='108' fill='%23ff6f59'/%3E%3Cpath d='M0 380 Q150 330 300 380 T600 380 T900 380 V600 H0 Z' fill='%232ec3c3'/%3E%3Cpath d='M0 450 Q180 402 360 450 T720 450 T900 444 V600 H0 Z' fill='%231f8a8a'/%3E%3Cpath d='M0 520 Q225 478 450 520 T900 520 V600 H0 Z' fill='%230f5c5c'/%3E%3C/svg%3E" alt="Coral sun rising over layered teal waves" draggable="false">
      <span class="wpc-tag">01 Daybreak</span>
    </li>
    <li class="wpc-slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Cdefs%3E%3ClinearGradient id='sea' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%232ec3c3'/%3E%3Cstop offset='1' stop-color='%230f5c5c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='900' height='600' fill='url(%23sea)'/%3E%3Ccircle cx='756' cy='108' r='46' fill='%23fbf7f0'/%3E%3Cg fill='none' stroke='%23fbf7f0' stroke-linecap='round'%3E%3Cpath d='M-40 200 Q80 150 200 200 T440 200 T680 200 T920 200' stroke-width='16' opacity='.9'/%3E%3Cpath d='M-40 330 Q100 282 240 330 T520 330 T800 330 T940 324' stroke-width='12' opacity='.6'/%3E%3Cpath d='M-40 460 Q120 414 280 460 T600 460 T920 460' stroke-width='9' opacity='.35'/%3E%3C/g%3E%3C/svg%3E" alt="White foam lines rolling across a deep teal sea" draggable="false">
      <span class="wpc-tag">02 Rollers</span>
    </li>
    <li class="wpc-slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Crect width='900' height='600' fill='%23fbf7f0'/%3E%3Ccircle cx='170' cy='128' r='58' fill='%232ec3c3'/%3E%3Cpath d='M0 340 Q220 236 460 326 T900 300 V600 H0 Z' fill='%23ece0cd'/%3E%3Cpath d='M0 440 Q260 340 520 428 T900 408 V600 H0 Z' fill='%23dfcda9'/%3E%3Cpath d='M0 532 Q300 452 620 520 T900 500 V600 H0 Z' fill='%23c9b184'/%3E%3Cg fill='none' stroke='%231c2b33' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M600 128 q18 -22 36 0 q18 -22 36 0'/%3E%3Cpath d='M706 176 q14 -18 28 0 q14 -18 28 0'/%3E%3C/g%3E%3C/svg%3E" alt="Warm sand dunes with birds and a teal sun" draggable="false">
      <span class="wpc-tag">03 Dunes</span>
    </li>
    <li class="wpc-slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Crect width='900' height='600' fill='%23f4ece0'/%3E%3Ccircle cx='150' cy='118' r='52' fill='%23ffffff'/%3E%3Cpath d='M0 420 Q150 396 300 420 T600 420 T900 420 V600 H0 Z' fill='%232ec3c3'/%3E%3Cpath d='M0 500 Q180 478 360 500 T720 500 T900 496 V600 H0 Z' fill='%231f8a8a'/%3E%3Crect x='642' y='250' width='8' height='170' fill='%231c2b33'/%3E%3Cpath d='M636 264 L636 404 L544 404 Z' fill='%23ffffff'/%3E%3Cpath d='M656 250 L656 404 L768 404 Z' fill='%23fbf7f0'/%3E%3Cpath d='M540 416 h216 l-34 44 h-148 Z' fill='%231c2b33'/%3E%3C/svg%3E" alt="Sailboat with two white sails on a teal sea" draggable="false">
      <span class="wpc-tag">04 Regatta</span>
    </li>
    <li class="wpc-slide">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 600'%3E%3Cdefs%3E%3ClinearGradient id='nt' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2314232b'/%3E%3Cstop offset='1' stop-color='%230f5c5c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='900' height='600' fill='url(%23nt)'/%3E%3Ccircle cx='640' cy='170' r='112' fill='%232ec3c3' opacity='.18'/%3E%3Ccircle cx='640' cy='170' r='72' fill='%237fe3e3'/%3E%3Cg fill='%23fbf7f0'%3E%3Ccircle cx='120' cy='84' r='4'/%3E%3Ccircle cx='262' cy='150' r='3'/%3E%3Ccircle cx='420' cy='66' r='3'/%3E%3Ccircle cx='822' cy='92' r='3'/%3E%3Ccircle cx='530' cy='128' r='2.5'/%3E%3Ccircle cx='84' cy='210' r='2.5'/%3E%3C/g%3E%3Cg fill='none' stroke='%232ec3c3' stroke-linecap='round'%3E%3Cpath d='M-40 470 Q90 442 220 470 T480 470 T740 470 T960 470' stroke-width='9' opacity='.8'/%3E%3Cpath d='M-40 535 Q110 512 260 535 T560 535 T900 535' stroke-width='7' opacity='.5'/%3E%3C/g%3E%3C/svg%3E" alt="Moonlit waves under a starry ink sky" draggable="false">
      <span class="wpc-tag">05 Night Tide</span>
    </li>
  </ul>

</body>
</html>
