<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverse-Scrolling Columns, minimal usage</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Demo-only page chrome and placeholder art. Not part of the component. */
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fbf7f0;
    color: #1c2b33;
  }
  .art-a { background: linear-gradient(160deg, #2ec3c3, #0f5c5c); }
  .art-b { background: linear-gradient(20deg, #f4ece0, #ece0cd 55%, #1f8a8a 140%); }
  .art-c { background: radial-gradient(120% 100% at 30% 20%, #1f8a8a, #1c2b33 80%); }
  .art-d { background: linear-gradient(200deg, #ece0cd, #2ec3c3); }
</style>
</head>
<body>

  <!--
    Three columns. The first and third get .rsc-reverse so they glide
    against the scroll direction in supporting browsers.
    Each column must be taller than the viewport.
  -->
  <div class="rsc-columns">

    <div class="rsc-column rsc-reverse">
      <figure class="rsc-item">
        <div class="rsc-art art-a"></div>
        <figcaption class="rsc-caption"><span>Tide Study</span> <span>01</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-b"></div>
        <figcaption class="rsc-caption"><span>Sand Bar</span> <span>02</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-c"></div>
        <figcaption class="rsc-caption"><span>Night Swim</span> <span>03</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-d"></div>
        <figcaption class="rsc-caption"><span>Shore Break</span> <span>04</span></figcaption>
      </figure>
    </div>

    <div class="rsc-column">
      <figure class="rsc-item">
        <div class="rsc-art art-c"></div>
        <figcaption class="rsc-caption"><span>Reef Line</span> <span>05</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-d"></div>
        <figcaption class="rsc-caption"><span>Drift</span> <span>06</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-a"></div>
        <figcaption class="rsc-caption"><span>Swell</span> <span>07</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-b"></div>
        <figcaption class="rsc-caption"><span>Salt Flats</span> <span>08</span></figcaption>
      </figure>
    </div>

    <div class="rsc-column rsc-reverse">
      <figure class="rsc-item">
        <div class="rsc-art art-b"></div>
        <figcaption class="rsc-caption"><span>Lagoon</span> <span>09</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-a"></div>
        <figcaption class="rsc-caption"><span>Undertow</span> <span>10</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-d"></div>
        <figcaption class="rsc-caption"><span>Dune Walk</span> <span>11</span></figcaption>
      </figure>
      <figure class="rsc-item">
        <div class="rsc-art art-c"></div>
        <figcaption class="rsc-caption"><span>Deep End</span> <span>12</span></figcaption>
      </figure>
    </div>

  </div>

</body>
</html>
