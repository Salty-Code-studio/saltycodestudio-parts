<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Cover Flow, minimal usage</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Page dressing only. The part is styles.css. */
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #1c2b33;
    color: #fbf7f0;
  }
  main { padding: 3rem 1rem; text-align: center; }
  .scf { scrollbar-color: rgba(251, 247, 240, .4) rgba(251, 247, 240, .08); }
  h1 { margin: 0 0 0.4rem; }
  main > p { margin: 0 0 2rem; color: #9fb3ba; }
</style>
</head>
<body>
<main>
  <h1>CSS Cover Flow</h1>
  <p>Swipe or scroll the shelf sideways. Covers rotate in 3D with zero JavaScript.</p>

  <div class="scf" role="region" aria-label="Cover flow shelf" tabindex="0">
    <ul class="scf-covers">
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #0f5c5c, #2ec3c3)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #fbf7f0, #ece0cd)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #1f8a8a, #0f5c5c)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #ff6f59, #f4ece0)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #2ec3c3, #1c2b33)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #ece0cd, #1f8a8a)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #4a5d66, #1c2b33)"></div></li>
      <li><div class="scf-cover" style="background: linear-gradient(135deg, #fbf7f0, #2ec3c3)"></div></li>
    </ul>
  </div>
</main>
</body>
</html>
