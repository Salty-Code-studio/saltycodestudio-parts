<!-- Retro Synthwave Grid Floor — markup snippet.
     Pair with styles.css. Drop this anywhere; the .rgf element
     fills its container, so give it a height (here via inline style).
     Place your real content inside .rgf__content (optional). -->
<div class="rgf" style="height: 70vh;">
  <div class="rgf__sky"></div>
  <div class="rgf__sun"></div>
  <div class="rgf__plane">
    <div class="rgf__grid"></div>
  </div>

  <!-- Optional foreground content layer (sits above the floor) -->
  <div class="rgf__content" style="position:relative; z-index:4;">
    <!-- your headline / hero copy here -->
  </div>
</div>
