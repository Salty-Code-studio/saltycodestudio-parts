<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shimmer Skeleton — saltycodestudio</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fdf6ec;font-family:system-ui,sans-serif;padding:2rem}

  /* ---- component ---- */
  .scs-skeleton{--scs-skel-base:#e7ddd0;--scs-skel-sheen:#fbf6ee;position:relative;display:block;border-radius:8px;background-color:var(--scs-skel-base);background-image:linear-gradient(100deg,transparent 20%,var(--scs-skel-sheen) 40%,var(--scs-skel-sheen) 50%,transparent 70%);background-size:220% 100%;background-repeat:no-repeat;background-position:-150% 0;animation:scs-skeleton-sweep 1.4s ease-in-out infinite;overflow:hidden}
  @keyframes scs-skeleton-sweep{to{background-position:250% 0}}
  .scs-skeleton--text{height:.75rem;border-radius:999px}
  .scs-skeleton--title{height:1.4rem;border-radius:6px}
  .scs-skeleton--avatar{width:56px;height:56px;border-radius:50%}
  .scs-skeleton--thumb{width:100%;aspect-ratio:16/9;border-radius:12px}
  .scs-skeleton--btn{width:120px;height:40px;border-radius:999px}
  .scs-skeleton--w90{width:90%}.scs-skeleton--w75{width:75%}.scs-skeleton--w60{width:60%}.scs-skeleton--w40{width:40%}
  @media (prefers-reduced-motion:reduce){.scs-skeleton{animation:none}}

  /* demo card */
  .card{background:#fff;border-radius:18px;padding:1.5rem;box-shadow:0 10px 30px rgba(13,42,58,.08);width:360px;display:grid;gap:1rem}
  .label{text-align:center;color:#7a8b91;font-size:.8rem;margin:0 0 1rem}
</style>
</head>
<body>
  <div>
    <p class="label">Loading state — shimmer sweeps left to right</p>
    <div class="card">
      <div class="scs-skeleton scs-skeleton--thumb"></div>
      <div style="display:flex;gap:1rem;align-items:center">
        <div class="scs-skeleton scs-skeleton--avatar"></div>
        <div style="flex:1;display:grid;gap:.6rem">
          <div class="scs-skeleton scs-skeleton--title scs-skeleton--w75"></div>
          <div class="scs-skeleton scs-skeleton--text scs-skeleton--w40"></div>
        </div>
      </div>
      <div class="scs-skeleton scs-skeleton--text scs-skeleton--w90"></div>
      <div class="scs-skeleton scs-skeleton--text"></div>
      <div class="scs-skeleton scs-skeleton--text scs-skeleton--w60"></div>
      <div class="scs-skeleton scs-skeleton--btn"></div>
    </div>
  </div>
</body>
</html>
