<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gradient Border Glow — saltycodestudio</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#0d2a3a,#05111a);font-family:system-ui,sans-serif;padding:2rem}

  /* ---- component ---- */
  @property --scs-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
  .scs-gradient-border{--scs-border-width:2px;--scs-radius:18px;position:relative;border-radius:var(--scs-radius);background:#0d2a3a;color:#eaf6f8;padding:1.75rem 2rem;z-index:0;isolation:isolate;max-width:340px}
  .scs-gradient-border::before{content:"";position:absolute;inset:calc(-1 * var(--scs-border-width));border-radius:inherit;z-index:-1;background:conic-gradient(from var(--scs-angle),#16b8c4,#4ec4a3,#e9c46a,#f4a259,#16b8c4);animation:scs-border-spin 4s linear infinite}
  .scs-gradient-border::after{content:"";position:absolute;inset:calc(-1 * var(--scs-border-width));border-radius:inherit;z-index:-2;background:conic-gradient(from var(--scs-angle),#16b8c4,#4ec4a3,#e9c46a,#f4a259,#16b8c4);filter:blur(16px);opacity:.7;animation:scs-border-spin 4s linear infinite}
  @keyframes scs-border-spin{to{--scs-angle:360deg}}
  .scs-gradient-border:hover::after{opacity:1;filter:blur(22px)}
  @media (prefers-reduced-motion:reduce){.scs-gradient-border::before,.scs-gradient-border::after{animation:none}}

  .hint{position:fixed;bottom:1.5rem;width:100%;text-align:center;color:#3f5b66;font-size:.8rem;left:0}
</style>
</head>
<body>
  <div class="scs-gradient-border">
    <h3 style="margin:0 0 .5rem">Glowing Border</h3>
    <p style="margin:0;opacity:.8">An animated rotating conic-gradient ring with a soft outer glow. Hover to brighten.</p>
  </div>
  <p class="hint">Hover the card to intensify the glow</p>
</body>
</html>
