<!-- Markup snippet: pair this with styles.css -->

<!-- Basic sliding underline -->
<a class="su-link" href="#">Read the field notes</a>

<!-- Inside a paragraph — wraps correctly across line breaks -->
<p>
  We hand-pick every batch on the windward coast, then
  <a class="su-link" href="#">document the harvest in a long, multi-line link
  that proves the underline wraps neatly from one line to the next</a>
  before it ever ships.
</p>

<!-- Reverse-wipe modifier -->
<a class="su-link su-link--reverse" href="#">Wipes in from the right</a>

<!-- Bold heading / CTA variant -->
<a class="su-link su-link--bold" href="#">View the collection</a>

<!-- Always-on underline that retracts on hover -->
<a class="su-link su-link--retract" href="#">Underlined until you hover</a>

<!-- Per-instance color override via the --su-color custom property -->
<a class="su-link" style="--su-color:#2ec3c3" href="#">Surf-accent link</a>
