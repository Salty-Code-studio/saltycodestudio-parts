<!-- Markup snippet for :has() Sibling Dim Spotlight.
     Pair with styles.css. Any number of .spotlight-card children works.
     Using <a> (or <button>) makes the cards keyboard-focusable so the
     :focus-visible spotlight fires for keyboard users too. -->
<ul class="spotlight-grid" role="list">
  <li>
    <a class="spotlight-card" href="#">
      <span class="spotlight-card__dot" aria-hidden="true"></span>
      <h3 class="spotlight-card__title">Tide Charts</h3>
      <p class="spotlight-card__body">Daily highs and lows for every break on the island.</p>
    </a>
  </li>
  <li>
    <a class="spotlight-card" href="#">
      <span class="spotlight-card__dot" aria-hidden="true"></span>
      <h3 class="spotlight-card__title">Board Library</h3>
      <p class="spotlight-card__body">Shapes, fins and volumes matched to your wave count.</p>
    </a>
  </li>
  <li>
    <a class="spotlight-card" href="#">
      <span class="spotlight-card__dot" aria-hidden="true"></span>
      <h3 class="spotlight-card__title">Sand Sessions</h3>
      <p class="spotlight-card__body">Sunrise lessons on the warm shallows of the bay.</p>
    </a>
  </li>
  <li>
    <a class="spotlight-card" href="#">
      <span class="spotlight-card__dot" aria-hidden="true"></span>
      <h3 class="spotlight-card__title">Reef Guide</h3>
      <p class="spotlight-card__body">Where the coral starts and how to read the channel.</p>
    </a>
  </li>
</ul>
