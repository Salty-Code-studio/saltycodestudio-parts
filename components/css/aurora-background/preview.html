<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurora Background — saltycodestudio</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,sans-serif}

  /* ---- component ---- */
  .scs-aurora{position:relative;overflow:hidden;background:radial-gradient(120% 120% at 50% 0%,#0a1f2b 0%,#06141d 70%);isolation:isolate}
  .scs-aurora__lights{position:absolute;inset:0;z-index:-1;filter:blur(60px) saturate(150%);pointer-events:none}
  .scs-aurora__lights span{position:absolute;display:block;border-radius:50%;opacity:.6;mix-blend-mode:screen;will-change:transform,opacity}
  .scs-aurora__lights span:nth-child(1){width:55vw;height:55vw;left:-10%;top:-20%;background:radial-gradient(circle,#16b8c4 0%,rgba(22,184,196,0) 70%);animation:scs-aurora-1 16s ease-in-out infinite alternate}
  .scs-aurora__lights span:nth-child(2){width:50vw;height:50vw;right:-15%;top:-10%;background:radial-gradient(circle,#2a9d8f 0%,rgba(42,157,143,0) 70%);animation:scs-aurora-2 21s ease-in-out infinite alternate}
  .scs-aurora__lights span:nth-child(3){width:45vw;height:45vw;left:25%;bottom:-25%;background:radial-gradient(circle,#4ec4a3 0%,rgba(78,196,163,0) 70%);animation:scs-aurora-3 18s ease-in-out infinite alternate}
  .scs-aurora__lights span:nth-child(4){width:40vw;height:40vw;right:10%;bottom:-20%;background:radial-gradient(circle,#6c5ce7 0%,rgba(108,92,231,0) 70%);animation:scs-aurora-4 24s ease-in-out infinite alternate}
  @keyframes scs-aurora-1{0%{transform:translate(0,0) scale(1);opacity:.55}100%{transform:translate(20%,25%) scale(1.3);opacity:.8}}
  @keyframes scs-aurora-2{0%{transform:translate(0,0) scale(1.1);opacity:.5}100%{transform:translate(-25%,20%) scale(1);opacity:.75}}
  @keyframes scs-aurora-3{0%{transform:translate(0,0) scale(1);opacity:.6}100%{transform:translate(15%,-30%) scale(1.2);opacity:.85}}
  @keyframes scs-aurora-4{0%{transform:translate(0,0) scale(1.05);opacity:.45}100%{transform:translate(-20%,-25%) scale(1.25);opacity:.7}}
  @media (prefers-reduced-motion:reduce){.scs-aurora__lights span{animation:none}}

  /* demo */
  .scs-aurora{min-height:100vh;display:grid;place-items:center;text-align:center;color:#eaf6f8;padding:2rem}
  .demo h1{margin:0;font-size:clamp(2.2rem,7vw,4.5rem);font-weight:800;letter-spacing:-.03em}
  .demo p{margin:.8rem 0 0;opacity:.7;font-size:1.1rem}
</style>
</head>
<body>
  <div class="scs-aurora">
    <div class="scs-aurora__lights" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="demo">
      <h1>Aurora</h1>
      <p>Soft northern-lights glow drifting behind your content.</p>
    </div>
  </div>
</body>
</html>
