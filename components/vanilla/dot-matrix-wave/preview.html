<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dot Matrix Wave · saltycodestudio-parts</title>
<style>
  :root {
    --sand: #F2EBDD;
    --sand-2: #EAE1CF;
    --teal: #0E3A40;
    --sky: #4FA8C9;
    --coral: #FF6F59;
    --ink: #1C2B2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--sand);
    color: var(--ink);
    overflow: hidden;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: var(--sand);
  }
  /* Full-bleed canvas sits behind the centered content. */
  #wave {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    pointer-events: none; /* let the pointer reach the canvas */
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--teal);
    opacity: 0.8;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(2.4rem, 7vw, 5.5rem);
    line-height: 1.02;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(242,235,221,0.6);
  }
  .lead {
    margin-top: 18px;
    max-width: 30rem;
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    line-height: 1.6;
    color: var(--teal);
  }

  /* Preset toggles are interactive, so re-enable pointer events on them. */
  .presets {
    position: fixed;
    z-index: 3;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--sand-2);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 10px 30px rgba(14,58,64,0.12);
  }
  .presets button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--teal);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .presets button:hover { background: var(--sand-2); }
  .presets button[aria-pressed="true"] {
    background: var(--teal);
    color: var(--sand);
  }
  .badge {
    position: fixed;
    z-index: 3;
    top: 20px;
    left: 22px;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    opacity: 0.65;
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="wave"></canvas>
    <div class="content">
      <p class="eyebrow">saltycodestudio · vanilla</p>
      <h1>Move across the grid.</h1>
      <p class="lead">
        A field of dots breathing on a traveling wave. Drag your pointer through
        it and the surface dents, dots scatter and grow, then settle back like
        water finding calm.
      </p>
    </div>
  </div>

  <div class="badge">Dot Matrix Wave</div>

  <div class="presets" role="group" aria-label="Wave presets">
    <button id="rippleBtn" aria-pressed="true">Ripple</button>
    <button id="stormBtn" aria-pressed="false">Storm</button>
  </div>

  <script src="./dot-matrix-wave.js"></script>
  <script>
    const canvas = document.getElementById('wave');
    const rippleBtn = document.getElementById('rippleBtn');
    const stormBtn = document.getElementById('stormBtn');

    const PRESETS = {
      ripple: {
        gap: 26,
        dotSize: 2.2,
        speed: 0.8,
        amplitude: 0.9,
        repelRadius: 130,
        repelStrength: 1,
      },
      storm: {
        gap: 22,
        dotSize: 2.6,
        speed: 2.1,
        amplitude: 1.8,
        repelRadius: 170,
        repelStrength: 1.5,
      },
    };

    let instance = null;

    function mount(name) {
      if (instance) instance.destroy();
      instance = initDotMatrixWave(canvas, PRESETS[name]);
      const ripple = name === 'ripple';
      rippleBtn.setAttribute('aria-pressed', String(ripple));
      stormBtn.setAttribute('aria-pressed', String(!ripple));
    }

    rippleBtn.addEventListener('click', () => mount('ripple'));
    stormBtn.addEventListener('click', () => mount('storm'));

    mount('ripple');
  </script>
</body>
</html>
