<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modal Dialog — saltycodestudio</title>
<style>
  :root { --sand:#f6ede0; --cream:#fbf6ee; --teal:#0e7c86; --navy:#0c2a33; --modal-sand:#f6ede0; --modal-cream:#fbf6ee; --modal-teal:#0e7c86; --modal-navy:#0c2a33; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--navy); background: radial-gradient(120% 120% at 50% 0%, var(--cream), var(--sand)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; padding: 4rem 1.5rem; text-align: center; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0; letter-spacing: -0.03em; }
  p.lead { max-width: 46ch; color: #436069; line-height: 1.6; margin: 0; }

  body.modal-open { overflow: hidden; }
  .modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1.5rem; visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
  .modal.is-open { visibility: visible; opacity: 1; transition: opacity 0.25s ease; }
  .modal__backdrop { position: absolute; inset: 0; background: rgba(12,42,51,0.55); backdrop-filter: blur(2px); }
  .modal__dialog { position: relative; z-index: 1; width: min(92vw, 460px); background: var(--modal-cream); color: var(--modal-navy); border-radius: 18px; padding: 2rem 2rem 1.75rem; box-shadow: 0 30px 80px -30px rgba(12,42,51,0.6); transform: translateY(12px) scale(0.97); opacity: 0; transition: transform 0.28s cubic-bezier(0.22,1,0.36,1), opacity 0.28s ease; text-align: left; }
  .modal.is-open .modal__dialog { transform: translateY(0) scale(1); opacity: 1; }
  .modal__close { position: absolute; top: 0.9rem; right: 0.9rem; width: 34px; height: 34px; display: grid; place-items: center; font-size: 1.4rem; line-height: 1; border: none; border-radius: 50%; background: transparent; color: var(--modal-navy); cursor: pointer; transition: background-color 0.2s ease; }
  .modal__close:hover { background: rgba(12,42,51,0.08); }
  .modal__close:focus-visible { outline: 2px solid var(--modal-teal); outline-offset: 2px; }
  .modal__title { margin: 0 0 0.6rem; font-size: 1.5rem; letter-spacing: -0.02em; }
  .modal__desc { margin: 0 0 1.6rem; line-height: 1.6; color: #436069; }
  .modal__actions { display: flex; gap: 0.75rem; justify-content: flex-end; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; padding: 0.7rem 1.4rem; border-radius: 999px; border: 1.5px solid var(--modal-teal); background: var(--modal-teal); color: var(--modal-cream); cursor: pointer; }
  .btn--ghost { background: transparent; color: var(--modal-teal); }
  .btn:focus-visible, .btn--ghost:focus-visible { outline: 2px solid var(--modal-navy); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .modal, .modal__dialog { transition: opacity 0.15s ease; } .modal__dialog { transform: none; } }
</style>
</head>
<body>
  <h1>Accessible Modal</h1>
  <p class="lead">Focus is trapped inside, Esc closes it, the backdrop is clickable, and the page behind is scroll-locked. Tab around to feel the trap.</p>
  <button type="button" class="btn" data-modal-open="demo-modal">Open dialog</button>

  <div class="modal" id="demo-modal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="demo-modal-title" aria-describedby="demo-modal-desc">
      <button type="button" class="modal__close" data-modal-close aria-label="Close dialog">&times;</button>
      <h2 class="modal__title" id="demo-modal-title">Join the list</h2>
      <p class="modal__desc" id="demo-modal-desc">Get occasional notes from saltycodestudio. No spam, just sand &amp; surf.</p>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" data-modal-close>Cancel</button>
        <button type="button" class="btn">Subscribe</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
