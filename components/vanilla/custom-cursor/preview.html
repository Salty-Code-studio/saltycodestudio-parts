<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom Cursor — saltycodestudio</title>
<style>
  :root {
    --sand: #f6ede0;
    --cream: #fbf6ee;
    --teal: #0e7c86;
    --navy: #0c2a33;
    --cursor-dot-size: 7px;
    --cursor-ring-size: 36px;
    --cursor-color: #0e7c86;
    --cursor-ring-color: rgba(14, 124, 134, 0.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, var(--cream), var(--sand));
    color: var(--navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 4rem 1.5rem;
    text-align: center;
  }
  h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0; letter-spacing: -0.02em; }
  p.lead { max-width: 46ch; color: #436069; font-size: 1.05rem; line-height: 1.6; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
  a.link {
    color: var(--teal);
    text-decoration: none;
    font-weight: 600;
    border-bottom: 2px solid rgba(14,124,134,0.3);
    padding-bottom: 2px;
  }
  button {
    font: inherit;
    font-weight: 600;
    padding: 0.9rem 1.8rem;
    border-radius: 999px;
    border: 1.5px solid var(--teal);
    background: var(--teal);
    color: var(--cream);
  }
  button.ghost { background: transparent; color: var(--teal); }
  .card {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(12,42,51,0.08);
    border-radius: 18px;
    padding: 2rem;
    max-width: 420px;
    box-shadow: 0 20px 50px -30px rgba(12,42,51,0.4);
  }
  .swatch[data-cursor] {
    display: inline-block;
    width: 90px; height: 90px; border-radius: 16px;
    background: linear-gradient(135deg, var(--teal), var(--navy));
  }
  small { color: #7a8d92; }
</style>
</head>
<body>
  <h1>Move your mouse</h1>
  <p class="lead">A precise dot tracks the pointer while a ring trails behind with eased motion. Hover anything interactive and the ring blooms. Touch devices keep their native behaviour.</p>

  <div class="card">
    <div class="row">
      <button>Primary action</button>
      <button class="ghost">Secondary</button>
    </div>
    <p style="margin:1.4rem 0 0">Read the <a class="link" href="#">documentation</a> or hover the swatch below.</p>
    <div style="margin-top:1.2rem"><span class="swatch" data-cursor></span></div>
    <p style="margin-top:1rem"><small>The swatch uses <code>data-cursor</code> to opt in.</small></p>
  </div>

  <!-- Custom Cursor markup -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <link rel="stylesheet" href="styles.css" />
  <script src="script.js"></script>
</body>
</html>
