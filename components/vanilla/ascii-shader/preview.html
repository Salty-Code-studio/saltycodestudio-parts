<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASCII Shader — saltycodestudio-parts</title>
<style>
  :root {
    --sand: #F2EBDD;
    --sand2: #EAE1CF;
    --teal: #0E3A40;
    --sky: #4FA8C9;
    --coral: #FF6F59;
    --ink: #1C2B2E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--sand);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Full-bleed stage holding the canvas + the overlaid content. */
  .stage {
    position: relative;
    height: 100vh;
    width: 100%;
    overflow: hidden;
  }

  #ascii {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Centered content sits above the live ASCII field. */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vw;
    pointer-events: none; /* let the pointer interact with the field */
  }

  .eyebrow {
    pointer-events: auto;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: clamp(0.65rem, 1.1vw, 0.8rem);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--teal);
    margin: 0 0 1.1rem;
    opacity: 0.85;
  }

  h1 {
    pointer-events: auto;
    margin: 0;
    font-size: clamp(2.2rem, 6.4vw, 5.4rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-weight: 680;
    color: var(--teal);
    text-shadow: 0 1px 0 rgba(242, 235, 221, 0.6);
  }

  h1 .glyph {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    color: var(--coral);
    font-weight: 600;
  }

  .lead {
    pointer-events: auto;
    max-width: 46ch;
    margin: 1.3rem 0 0;
    font-size: clamp(0.95rem, 1.7vw, 1.15rem);
    line-height: 1.55;
    color: var(--ink);
    opacity: 0.78;
  }

  /* Preset toggle pills, bottom-center. */
  .presets {
    pointer-events: auto;
    position: absolute;
    z-index: 3;
    left: 50%;
    bottom: clamp(1.4rem, 4vh, 2.6rem);
    transform: translateX(-50%);
    display: flex;
    gap: 0.5rem;
    padding: 0.4rem;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(14, 58, 64, 0.14);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .presets button {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    color: var(--teal);
    background: transparent;
    border: 0;
    padding: 0.5rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }

  .presets button:hover { background: rgba(14, 58, 64, 0.08); }

  .presets button[aria-pressed="true"] {
    background: var(--teal);
    color: var(--sand);
  }

  .credit {
    position: absolute;
    z-index: 3;
    right: clamp(1rem, 3vw, 2rem);
    bottom: clamp(1rem, 3vh, 1.6rem);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal);
    opacity: 0.55;
  }
</style>
</head>
<body>
  <main class="stage">
    <canvas id="ascii" aria-hidden="true"></canvas>

    <div class="content">
      <p class="eyebrow">saltycodestudio · vanilla</p>
      <h1>Hello, world <span class="glyph">~</span> in glyphs.</h1>
      <p class="lead">
        A flowing intensity field, rendered live as ASCII on a single canvas.
        Move your cursor and the field bulges toward it. Calm teal and sand,
        with a single coral accent where the field runs hottest.
      </p>
    </div>

    <div class="presets" role="group" aria-label="Effect presets">
      <button id="p-sparse" type="button" aria-pressed="true">Sparse</button>
      <button id="p-dense" type="button" aria-pressed="false">Dense</button>
    </div>

    <span class="credit">ascii-shader · original · MIT</span>
  </main>

  <script type="module">
    import { initAsciiShader } from './ascii-shader.js';

    const canvas = document.getElementById('ascii');

    // Two presets that read very differently:
    //  - Sparse: wide cells + a short ramp -> airy, terminal-poster feel.
    //  - Dense : small cells + a long ramp -> fine, detailed glyph gradients.
    const PRESETS = {
      sparse: {
        cell: 20,
        ramp: ' .:-=+#',
        speed: 0.9,
        scale: 0.85,
        mouseInfluence: 1.15,
        coralThreshold: 0.9,
        contrast: 1.15,
      },
      dense: {
        cell: 11,
        ramp: " .'`^\",:;Il!i~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
        speed: 1,
        scale: 1.15,
        mouseInfluence: 1,
        coralThreshold: 0.94,
        contrast: 1,
      },
    };

    let handle = initAsciiShader(canvas, PRESETS.sparse);

    const btnSparse = document.getElementById('p-sparse');
    const btnDense = document.getElementById('p-dense');

    function setPreset(name, pressedBtn, otherBtn) {
      handle.destroy();
      handle = initAsciiShader(canvas, PRESETS[name]);
      pressedBtn.setAttribute('aria-pressed', 'true');
      otherBtn.setAttribute('aria-pressed', 'false');
    }

    btnSparse.addEventListener('click', () => setPreset('sparse', btnSparse, btnDense));
    btnDense.addEventListener('click', () => setPreset('dense', btnDense, btnSparse));

    window.addEventListener('beforeunload', () => handle.destroy());
  </script>
</body>
</html>
