<!doctype html>
<!--
  data-palette / data-mode are read by the foundations' palettes.css to theme
  the page. "sand-surf" + "light" is the official brand default. Switch
  data-mode to "dark" (or toggle a `dark` class) to use the dark palette.
-->
<html lang="en" data-palette="sand-surf" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2EBDD" />
    <meta
      name="description"
      content="saltycodestudio starter — clean code, warm coast."
    />

    <!--
      Brand fonts: Space Grotesk (display), JetBrains Mono (code/labels),
      Inter (body). These three are what the Tailwind preset's fontFamily
      maps to (font-display / font-mono / font-sans).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>saltycodestudio · Vite + React + Tailwind starter</title>
  </head>
  <body>
    <!-- React mounts here; see src/main.tsx -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
